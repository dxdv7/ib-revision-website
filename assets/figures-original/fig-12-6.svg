<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Figure 12.6: Economies of scale in monopoly" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Figure 12.6: Economies of scale in monopoly</title><desc>Comparing a perfect-competition industry supply curve with a monopolist's lower MC curve from economies of scale, showing the monopolist producing a greater output Q2 at a lower price P2 than perfect competition's Q1, P1.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="390.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="395.0,318.0 386.0,314.2 386.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="234.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Output (units)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price ($)</text>
  <path d="M78.00,66.75 L368.00,197.40" fill="none" stroke="#6b6b6b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="372.0" y="201.4" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D = AR</text>
  <path d="M78.00,66.75 L356.85,318.00" fill="none" stroke="#8e3b9e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360.8" y="322.0" font-size="12.5" text-anchor="start" fill="#8e3b9e" font-weight="400">MR</text>
  <path d="M78.00,284.50 L338.26,50.00" fill="none" stroke="#d9432f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="254.3" y="40.0" font-size="11" text-anchor="start" fill="#d9432f" font-weight="400">Industry supply:</text>
  <text x="254.3" y="54.0" font-size="11" text-anchor="start" fill="#d9432f" font-weight="400">perfect competition</text>
  <path d="M78.00,292.88 L368.00,266.75" fill="none" stroke="#2f5fb0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290.0" y="282.7" font-size="11" text-anchor="start" fill="#2f5fb0" font-weight="400">MC: monopoly</text>
  <circle cx="239.1" cy="139.3" r="3.6" fill="#2b2b2b"/>
  <circle cx="306.1" cy="272.3" r="3.6" fill="#2b2b2b"/>
  <circle cx="306.1" cy="169.5" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="139.3" x2="239.1" y2="139.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="143.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="239.1" y1="139.3" x2="239.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>

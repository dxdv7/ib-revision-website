<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Phillips curve relationship through AD/AS analysis" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Phillips curve relationship through AD/AS analysis</title><desc>AD/AS diagram: aggregate demand rises from AD1 to AD2 along the upward-sloping SRAS curve, raising output from Y1 to Y2 and the price level from P1 to P2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="96.0" y1="96.0" x2="288.0" y2="274.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="180.0" y1="62.0" x2="372.0" y2="240.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="112.0" y1="294.0" x2="332.0" y2="64.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="293.0" y="280.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="377.0" y="246.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="326.0" y="56.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS</text>
  <line x1="78.0" y1="196.9" x2="204.9" y2="196.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="200.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="204.9" y1="196.9" x2="204.9" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="204.9" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="204.9" cy="196.9" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="137.6" x2="261.6" y2="137.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="141.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="261.6" y1="137.6" x2="261.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="261.6" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="261.6" cy="137.6" r="3.6" fill="#2b2b2b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="An inflationary gap in the new classical model" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>An inflationary gap in the new classical model</title><desc>LRAS at Yf, an upward-sloping SRAS and AD shifting right from AD1 to AD2. In the short run output rises to Y1 above Yf, marked as the inflationary gap.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="78.0" y1="190.0" x2="230.0" y2="190.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="194.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="230.0" y1="190.0" x2="230.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="230.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size='70%' dy='3'>f</tspan></text>
  <line x1="78.0" y1="155.0" x2="271.1" y2="155.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="159.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="271.1" y1="155.0" x2="271.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="271.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="110.0" y1="82.0" x2="310.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="190.0" y1="82.0" x2="390.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="110.0" y1="292.0" x2="340.6" y2="96.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="230.0" y1="318.0" x2="230.0" y2="48.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="230.0" cy="190.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="271.1" cy="155.0" r="3.6" fill="#2b2b2b"/>
  <line x1="134.0" y1="100.0" x2="201.2" y2="100.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="206.0,100.0 198.0,96.6 198.0,103.4" fill="#4a3f9f"/>
  <line x1="300.7" y1="250.0" x2="367.9" y2="250.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="372.7,250.0 364.7,246.6 364.7,253.4" fill="#4a3f9f"/>
  <line x1="250.6" y1="304.0" x2="236.6" y2="304.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="233.0,304.0 239.0,306.5 239.0,301.5" fill="#4a3f9f"/>
  <line x1="250.6" y1="304.0" x2="264.5" y2="304.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="268.1,304.0 262.1,301.5 262.1,306.5" fill="#4a3f9f"/>
  <text x="279.1" y="308.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Inflationary gap</text>
  <text x="230.0" y="38.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">LRAS</text>
  <text x="346.6" y="100.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS</text>
  <text x="310.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="390.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
</svg>

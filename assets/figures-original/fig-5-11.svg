<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="effect of removing a tax on soft drinks" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>effect of removing a tax on soft drinks</title><desc>Two parallel upward-sloping supply curves for soft drinks: S1 with the tax on the left and S2 without the tax on the right, with a rightward arrow between them.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity (millions of cans per month)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price per can (US $)</text>
  <line x1="123.4" y1="291.2" x2="220.0" y2="87.5" stroke="#2b2b2b" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="197.3" y1="291.2" x2="293.8" y2="87.5" stroke="#2b2b2b" stroke-width="2.6" stroke-linecap="round"/>
  <text x="232.0" y="77.5" font-size="12.5" text-anchor="end" fill="#2b2b2b" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"> (with tax)</tspan></text>
  <text x="281.8" y="77.5" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">S<tspan font-size="70%" dy="3">2</tspan><tspan dy="-3"> (without tax)</tspan></text>
  <line x1="168.1" y1="205.4" x2="229.1" y2="205.4" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="233.9,205.4 225.9,202.1 225.9,208.8" fill="#4a3f9f"/>
</svg>

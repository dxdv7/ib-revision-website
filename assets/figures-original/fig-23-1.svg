<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Production possibility curves to show comparative advantage" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Production possibility curves to show comparative advantage</title><desc>Two straight-line PPCs on rice (vertical) and textiles (horizontal) axes: Thailand's frontier lies further out on both axes than Peru's, with the gap (a) on the rice axis much larger than the gap (b) on the textiles axis.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Textiles (bales)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Rice (tonnes)</text>
  <text x="141.1" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2</text>
  <text x="204.2" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">4</text>
  <text x="267.3" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">6</text>
  <text x="330.4" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">8</text>
  <text x="70.0" y="245.4" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">2</text>
  <text x="70.0" y="168.9" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">4</text>
  <text x="70.0" y="92.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">6</text>
  <line x1="78.0" y1="88.3" x2="330.4" y2="318.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="241.4" x2="267.3" y2="318.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="286.3" y="245.3" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">Thailand</text>
  <text x="229.5" y="277.8" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">Peru</text>
  <line x1="57.5" y1="241.4" x2="57.5" y2="88.3" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="57.5,88.3 50.5,85.3 50.5,91.2" fill="#4a3f9f"/>
  <polygon points="57.5,241.4 64.5,244.4 64.5,238.5" fill="#4a3f9f"/>
  <text x="49.5" y="168.9" font-size="12" text-anchor="end" fill="#4a3f9f" font-weight="400">(a)</text>
  <line x1="267.3" y1="342.9" x2="330.4" y2="342.9" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="330.4,342.9 333.4,335.9 327.5,335.9" fill="#4a3f9f"/>
  <polygon points="267.3,342.9 264.4,349.9 270.3,349.9" fill="#4a3f9f"/>
  <text x="298.9" y="358.9" font-size="12" text-anchor="middle" fill="#4a3f9f" font-weight="400">(b)</text>
</svg>

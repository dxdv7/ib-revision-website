<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" role="img" aria-label="Measures to reduce e-cigarette consumption" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Measures to reduce e-cigarette consumption</title><desc>A per-unit tax shifts MSC up, or a campaign shifts MPB left, so that output falls to the efficient quantity Q*.</desc>
  <rect width="540" height="480" fill="#ffffff"/>
  <g transform="translate(0,0)">
  <polygon points="78.0,213.8 243.0,213.8 243.0,154.2 78.0,154.2" fill="#f6d9a0" stroke="none"/>
  <polygon points="243.0,213.8 309.0,184.0 309.0,243.6" fill="#f3b3aa" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="430.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="435.0,318.0 426.0,314.2 426.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="254.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of e-cigarettes (million packs)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of e-cigarettes ($ per pack)</text>
  <line x1="78.0" y1="184.0" x2="309.0" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="188.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="309.0" y1="184.0" x2="309.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="309.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="213.8" x2="243.0" y2="213.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="217.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P*</text>
  <line x1="243.0" y1="213.8" x2="243.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="243.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q*</text>
  <line x1="78.0" y1="154.2" x2="243.0" y2="154.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="158.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">t</tspan></text>
  <line x1="94.5" y1="87.2" x2="408.0" y2="228.7" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="94.5" y1="146.8" x2="408.0" y2="288.2" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="94.5" y1="280.8" x2="408.0" y2="139.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="94.5" y1="221.2" x2="391.5" y2="87.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5"/>
  <text x="416.0" y="232.7" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MPB</text>
  <text x="416.0" y="292.2" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MSB</text>
  <text x="416.0" y="143.3" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC</text>
  <text x="399.5" y="91.2" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC + tax</text>
  <circle cx="309.0" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="243.0" cy="213.8" r="3.6" fill="#2b2b2b"/>
  <circle cx="243.0" cy="154.2" r="3.6" fill="#2b2b2b"/>
  <line x1="361.8" y1="156.2" x2="361.8" y2="109.4" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="361.8,104.6 358.4,112.6 365.2,112.6" fill="#4a3f9f"/>
  <text x="370.8" y="134.4" font-size="13" text-anchor="start" fill="#4a3f9f" font-weight="700">1</text>
  <line x1="272.0" y1="169.1" x2="152.8" y2="169.1" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="148.0,169.1 156.0,172.5 156.0,165.8" fill="#4a3f9f"/>
  <text x="210.0" y="160.1" font-size="13" text-anchor="middle" fill="#4a3f9f" font-weight="700">2</text>
  </g>
  <text x="94.0" y="396.0" font-size="12.5" text-anchor="start" fill="#4a3f9f" font-weight="700">1</text>
  <text x="115.0" y="396.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Solution 1: a tax of $8 per pack shifts MSC up to MSC + tax</text>
  <text x="94.0" y="415.0" font-size="12.5" text-anchor="start" fill="#4a3f9f" font-weight="700">2</text>
  <text x="115.0" y="415.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Solution 2: an anti-vaping campaign shifts MPB left towards MSB</text>
  <rect x="90" y="424" width="16" height="11" fill="#f6d9a0" stroke="#9a9a9a" stroke-width="0.7"/>
  <text x="115.0" y="434.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Tax revenue ($8 x Q*)</text>
  <rect x="90" y="443" width="16" height="11" fill="#f3b3aa" stroke="#9a9a9a" stroke-width="0.7"/>
  <text x="115.0" y="453.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Welfare loss removed if output falls to Q*</text>
</svg>

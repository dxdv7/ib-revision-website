<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="Social efficiency in the market for bicycles" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Social efficiency in the market for bicycles</title><desc>MSB and MSC intersect at c; consumer surplus lies above the equilibrium price and producer surplus below it, together making community surplus.</desc>
  <rect width="480" height="380" fill="#ffffff"/>
  <polygon points="78.0,83.5 248.4,184.0 78.0,184.0" fill="#f6d9a0" stroke="none"/>
  <polygon points="78.0,184.0 248.4,184.0 78.0,284.5" fill="#b4e3e9" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of bicycles (000s)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price ($)</text>
  <line x1="78.0" y1="83.5" x2="362.0" y2="251.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="284.5" x2="362.0" y2="117.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="370.0" y="255.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MSB = D</text>
  <text x="370.0" y="121.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC = S</text>
  <line x1="78.0" y1="184.0" x2="248.4" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="188.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P*</text>
  <line x1="248.4" y1="184.0" x2="248.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="248.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q*</text>
  <circle cx="248.4" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="78.0" cy="83.5" r="3.4" fill="#2b2b2b"/>
  <circle cx="78.0" cy="284.5" r="3.4" fill="#2b2b2b"/>
  <text x="86.0" y="87.5" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">a</text>
  <text x="86.0" y="288.5" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">d</text>
  <text x="248.4" y="173.0" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="400">c</text>
  <text x="86.5" y="154.7" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Consumer surplus</text>
  <text x="86.5" y="221.7" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Producer surplus</text>
  <text x="185.9" y="62.6" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="700">Community surplus</text>
  <text x="185.9" y="77.6" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">= consumer surplus</text>
  <text x="185.9" y="92.7" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">+ producer surplus</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Good deflation" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Good deflation</title><desc>AD/AS diagram: the vertical LRAS shifts right from LRAS1 to LRAS2 against a fixed downward-sloping AD curve, raising real output from Y1 to Y2 while the price level falls from P1 to P2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="100.0" y1="84.0" x2="372.0" y2="266.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="176.0" y1="318.0" x2="176.0" y2="52.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="262.0" y1="318.0" x2="262.0" y2="52.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="376.0" y="280.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD</text>
  <text x="176.0" y="42.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">LRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="262.0" y="42.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">LRAS<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="78.0" y1="134.9" x2="176.0" y2="134.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="138.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="176.0" cy="134.9" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="192.4" x2="262.0" y2="192.4" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="196.4" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="262.0" cy="192.4" r="3.6" fill="#2b2b2b"/>
  <text x="176.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="262.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="180.0" y1="100.0" x2="253.2" y2="100.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="258.0,100.0 250.0,96.6 250.0,103.4" fill="#4a3f9f"/>
  <line x1="186.0" y1="345.0" x2="247.8" y2="345.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="252.0,345.0 245.0,342.1 245.0,347.9" fill="#4a3f9f"/>
  <line x1="40.0" y1="140.9" x2="40.0" y2="182.2" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="40.0,186.4 42.9,179.4 37.1,179.4" fill="#4a3f9f"/>
</svg>

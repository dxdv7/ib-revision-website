<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The demand for bicycles (a movement)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The demand for bicycles (a movement)</title><desc>A downward-sloping demand curve for bicycles with prices p and p1 and quantities q and q1 marked, showing a movement along the curve.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of bicycles (units per month)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of bicycles ($)</text>
  <line x1="110.0" y1="60.0" x2="370.0" y2="290.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="376.0" y="300.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <line x1="78.0" y1="130.0" x2="189.1" y2="130.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="134.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">p</text>
  <line x1="189.1" y1="130.0" x2="189.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="189.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q</text>
  <line x1="78.0" y1="210.0" x2="279.6" y2="210.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="214.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">p<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="279.6" y1="210.0" x2="279.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="279.6" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="189.1" cy="130.0" r="3.4" fill="#d9432f"/>
  <circle cx="279.6" cy="210.0" r="3.4" fill="#d9432f"/>
  <line x1="44.0" y1="136.0" x2="44.0" y2="199.8" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="44.0,204.0 46.9,197.0 41.1,197.0" fill="#4a3f9f"/>
  <line x1="201.1" y1="331.0" x2="263.4" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="267.6,331.0 260.6,328.1 260.6,333.9" fill="#4a3f9f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" role="img" aria-label="Maximum price on rice" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Maximum price on rice</title><desc>A price ceiling of $10 below the $14 equilibrium: quantity demanded 80 exceeds quantity supplied 40, leaving excess demand.</desc>

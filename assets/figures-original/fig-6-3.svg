<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Supply curves with different PES values" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Supply curves with different PES values</title><desc>Four straight-line supply curves: S1 and S2 pass through the origin (PES = 1), S3 starts on the quantity axis (PES below 1) and S4 starts on the price axis (PES above 1).</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity supplied</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of product ($)</text>
  <line x1="78.0" y1="318.0" x2="234.2" y2="82.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="310.9" y2="186.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="177.4" y1="318.0" x2="259.8" y2="90.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="237.6" x2="310.9" y2="160.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="228.2" y="74.2" font-size="12" text-anchor="end" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"> (PES = 1)</tspan></text>
  <text x="263.8" y="82.2" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">3</tspan><tspan dy="-3"> (PES &lt; 1)</tspan></text>
  <text x="318.9" y="161.7" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">4</tspan><tspan dy="-3"> (PES &gt; 1)</tspan></text>
  <text x="318.9" y="190.7" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">2</tspan><tspan dy="-3"> (PES = 1)</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Figure 12.7: Monopoly versus perfect competition without economies of scale" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Figure 12.7: Monopoly versus perfect competition without economies of scale</title><desc>A single MC curve shared by perfect competition and monopoly, with perfect competition at price P1, output Q1, versus the profit-maximizing monopolist restricting output to Q2 and charging the higher price P2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Output (units)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price ($)</text>
  <path d="M78.00,66.75 L362.00,152.17" fill="none" stroke="#6b6b6b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366.0" y="156.2" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D = AR</text>
  <path d="M78.00,66.75 L286.82,192.38" fill="none" stroke="#2f5fb0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290.8" y="196.4" font-size="12.5" text-anchor="start" fill="#2f5fb0" font-weight="400">MR</text>

  <text x="390.0" y="136.5" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Inequality-adjusted</text>
  <text x="390.0" y="151.9" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">education index</text>
  <rect x="545.0" y="117.0" width="190.0" height="46.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="640.0" y="136.5" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Inequality-adjusted</text>
  <text x="640.0" y="151.9" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">income index</text>
  <rect x="60.0" y="211.0" width="160.0" height="42.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="140.0" y="236.2" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Life expectancy</text>

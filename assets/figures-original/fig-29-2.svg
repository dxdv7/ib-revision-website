  <rect x="560.0" y="211.0" width="160.0" height="42.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="640.0" y="236.2" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Income / consumption</text>
  <rect x="60.0" y="307.0" width="160.0" height="46.0" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2.0"/>
  <text x="140.0" y="333.7" font-size="10.5" text-anchor="middle" fill="#2b2b2b" font-weight="600">Life expectancy at birth</text>
  <rect x="270.0" y="307.0" width="130.0" height="46.0" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2.0"/>

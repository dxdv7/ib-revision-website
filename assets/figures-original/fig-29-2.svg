<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-label="The elements of the IHDI" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The elements of the IHDI</title><desc>Tree diagram showing the Inequality-adjusted Human Development Index built bottom-up from three inequality-adjusted dimension indices: life expectancy, education, and income.</desc>
  <rect width="780" height="380" fill="#ffffff"/>
  <rect x="240.0" y="19.0" width="300.0" height="50.0" rx="8" fill="#f8d3cd" stroke="#d9432f" stroke-width="2.4"/>

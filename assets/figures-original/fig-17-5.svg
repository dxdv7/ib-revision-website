<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The demand for money" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The demand for money</title><desc>A downward-sloping demand curve for money, DM. At a higher nominal interest rate i1 the quantity of money demanded is Q1; at a lower rate i2 it is the larger Q2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of money</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Nominal interest rate</text>
  <line x1="78.0" y1="121.2" x2="170.0" y2="121.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="125.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="170.0" y1="121.2" x2="170.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="170.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="206.2" x2="270.0" y2="206.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="210.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="270.0" y1="206.2" x2="270.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="270.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="105.0" y1="66.0" x2="345.0" y2="270.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="170.0" cy="121.2" r="3.6" fill="#2b2b2b"/>
  <circle cx="270.0" cy="206.2" r="3.6" fill="#2b2b2b"/>
  <line x1="34.0" y1="127.2" x2="34.0" y2="196.1" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="34.0,200.2 36.9,193.2 31.1,193.2" fill="#4a3f9f"/>
  <line x1="182.0" y1="331.0" x2="253.8" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="258.0,331.0 251.0,328.1 251.0,333.9" fill="#4a3f9f"/>
  <text x="353.0" y="276.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">D<tspan font-size="70%" dy="3">M</tspan></text>
</svg>

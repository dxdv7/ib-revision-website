<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="A perfectly elastic supply curve (PES = infinity)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A perfectly elastic supply curve (PES = infinity)</title><desc>A horizontal supply curve at price P1: any quantity is supplied at P1 and none below it, so PES is infinite.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity supplied of product</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of product ($)</text>
  <line x1="78.0" y1="170.6" x2="92.2" y2="170.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="174.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="78.0" y1="170.6" x2="339.3" y2="170.6" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="347.3" y="175.6" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="208.6" y="156.6" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">PES = &#8734;</text>
  <text x="208.6" y="196.6" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="400" font-style="italic">Below P<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan>, nothing is supplied</text>
</svg>

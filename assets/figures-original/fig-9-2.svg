  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of vaccines (000 doses)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of vaccines ($ per dose)</text>
  <line x1="78.0" y1="206.3" x2="234.2" y2="206.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="210.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="234.2" y1="206.3" x2="234.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="234.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="176.6" x2="291.0" y2="176.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="180.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P*</text>
  <line x1="291.0" y1="176.6" x2="291.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="291.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q*</text>
  <line x1="92.2" y1="131.9" x2="362.0" y2="273.3" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="72.3" x2="362.0" y2="213.8" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="280.8" x2="362.0" y2="139.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="370.0" y="277.3" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MPB = D</text>
  <text x="370.0" y="217.8" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MSB</text>
  <text x="370.0" y="143.3" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC = S</text>
  <circle cx="234.2" cy="206.3" r="3.6" fill="#2b2b2b"/>
  <circle cx="291.0" cy="176.6" r="3.6" fill="#2b2b2b"/>
  <line x1="140.5" y1="157.2" x2="140.5" y2="97.6" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <polygon points="140.5,97.6 137.5,104.6 143.4,104.6" fill="#4a3f9f"/>
  <polygon points="140.5,157.2 143.4,150.2 137.5,150.2" fill="#4a3f9f"/>
  <text x="154.5" y="133.4" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">Positive</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 380" role="img" aria-label="Positive externality of consumption: vaccines" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Positive externality of consumption: vaccines</title><desc>MSB lies above MPB by the external benefit; the market quantity Q1 is below the efficient quantity Q*, leaving a welfare gain triangle.</desc>
  <rect width="470" height="380" fill="#ffffff"/>
  <polygon points="234.2,146.8 234.2,206.3 291.0,176.6" fill="#b5e2c0" stroke="none"/>

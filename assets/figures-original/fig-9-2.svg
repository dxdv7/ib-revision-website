  <line x1="272.8" y1="98.7" x2="265.9" y2="172.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="265.6,175.6 268.7,169.8 263.7,169.3" fill="#2b2b2b"/>
</svg>

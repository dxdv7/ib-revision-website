<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" role="img" aria-label="The logic chain behind the Law of Supply" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The logic chain behind the Law of Supply</title><desc>Flow chart of five boxes joined by downward arrows: adding a variable factor, diminishing returns, rising marginal cost, higher prices needed to supply more, so the supply curve slopes upward.</desc>
  <rect width="420" height="500" fill="#ffffff"/>
  <rect x="30" y="18" width="360" height="64" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.2"/>
  <text x="210.0" y="37.5" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">To produce more output, a firm adds extra</text>
  <text x="210.0" y="54.5" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">units of a variable factor (such as labour)</text>
  <text x="210.0" y="71.5" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">to its fixed factors</text>
  <line x1="210.0" y1="86.0" x2="210.0" y2="107.2" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="210.0,112.0 213.4,104.0 206.6,104.0" fill="#2b2b2b"/>
  <rect x="30" y="116" width="360" height="64" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.2"/>
  <text x="210.0" y="135.5" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Eventually each extra unit of the variable</text>
  <text x="210.0" y="152.5" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">factor adds less output than the one before:</text>
  <text x="210.0" y="169.5" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">diminishing marginal returns</text>
  <line x1="210.0" y1="184.0" x2="210.0" y2="205.2" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="210.0,210.0 213.4,202.0 206.6,202.0" fill="#2b2b2b"/>
  <rect x="30" y="214" width="360" height="64" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.2"/>
  <text x="210.0" y="242.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">So the extra cost of producing each further</text>
  <text x="210.0" y="259.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">unit of output (marginal cost, MC) rises</text>
  <line x1="210.0" y1="282.0" x2="210.0" y2="303.2" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="210.0,308.0 213.4,300.0 206.6,300.0" fill="#2b2b2b"/>
  <rect x="30" y="312" width="360" height="64" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.2"/>
  <text x="210.0" y="340.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">A firm will only supply more if the price</text>
  <text x="210.0" y="357.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">rises enough to cover that higher MC</text>
  <line x1="210.0" y1="380.0" x2="210.0" y2="401.2" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="210.0,406.0 213.4,398.0 206.6,398.0" fill="#2b2b2b"/>
  <rect x="30" y="410" width="360" height="64" rx="8" fill="#e4f2e6" stroke="#2e7d4f" stroke-width="2.2"/>
  <text x="210.0" y="438.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Result: the supply curve slopes upward</text>
  <text x="210.0" y="455.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">(the Law of Supply)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" role="img" aria-label="The world market for cocoa" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The world market for cocoa</title><desc>Demand-and-supply diagram for the world cocoa market showing price on the vertical axis and quantity on the horizontal axis, with a steep demand curve and three steep supply curves (S1, S2, S3) illustrating how small shifts in supply cause large price swings.</desc>
  <rect width="440" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of cocoa (tonnes, million)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of cocoa (US$ per tonne)</text>
  <line x1="210.5" y1="93.4" x2="324.1" y2="185.3" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="210.5" y1="185.3" x2="324.1" y2="93.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="210.5" y1="215.9" x2="324.1" y2="124.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="210.5" y1="154.6" x2="324.1" y2="62.8" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="267.3" cy="139.3" r="3.6" fill="#2b2b2b"/>
  <circle cx="286.3" cy="154.6" r="3.6" fill="#2b2b2b"/>
  <circle cx="248.4" cy="124.0" r="3.6" fill="#2b2b2b"/>
  <line x1="248.4" y1="124.0" x2="248.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="248.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">3</tspan></text>
  <line x1="267.3" y1="139.3" x2="267.3" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="267.3" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="286.3" y1="154.6" x2="286.3" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="286.3" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="70.0" y="128.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">3</tspan></text>
  <text x="70.0" y="143.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="70.0" y="158.6" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="224.0" y1="177.6" x2="249.1" y2="177.6" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="253.9,177.6 245.9,174.3 245.9,181.0" fill="#4a3f9f"/>
  <line x1="310.7" y1="101.0" x2="285.6" y2="101.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="280.8,101.0 288.8,104.4 288.8,97.7" fill="#4a3f9f"/>
  <text x="330.1" y="189.3" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="330.1" y="97.4" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="330.1" y="122.0" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="330.1" y="66.8" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">3</tspan></text>
  <text x="238.9" y="167.6" font-size="10.5" text-anchor="middle" fill="#4a3f9f" font-weight="600">Bumper harvest</text>
  <text x="295.7" y="91.0" font-size="10.5" text-anchor="middle" fill="#4a3f9f" font-weight="600">Poor harvest</text>
</svg>

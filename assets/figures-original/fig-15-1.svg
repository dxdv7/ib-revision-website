  <circle cx="288.0" cy="112.6" r="3.6" fill="#2b2b2b"/>
  <line x1="34.0" y1="229.8" x2="34.0" y2="122.8" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="34.0,118.6 31.1,125.6 36.9,125.6" fill="#4a3f9f"/>
  <line x1="217.0" y1="331.0" x2="271.8" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="276.0,331.0 269.0,328.1 269.0,333.9" fill="#4a3f9f"/>
  <text x="316.0" y="65.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS</text>
  <text x="92.0" y="294.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">Spare capacity:</text>
  <text x="92.0" y="307.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">prices rise slowly</text>
  <text x="92.0" y="66.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">Near full capacity:</text>
  <text x="92.0" y="79.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">prices rise sharply</text>
</svg>

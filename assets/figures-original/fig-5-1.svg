<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="A supply curve for bicycles" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A supply curve for bicycles</title><desc>Upward-sloping supply curve for bicycles: quantity supplied rises from 1,000 to 2,000 a month as the price rises from $150 to $250.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of bicycles (per month)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of bicycles ($)</text>
  <text x="70.0" y="283.7" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">50</text>
  <text x="70.0" y="245.4" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">100</text>
  <text x="70.0" y="207.1" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">150</text>
  <text x="70.0" y="168.9" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">200</text>
  <text x="70.0" y="130.6" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">250</text>
  <text x="70.0" y="92.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">300</text>
  <text x="70.0" y="54.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">350</text>
  <text x="134.8" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">500</text>
  <text x="191.6" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">1,000</text>
  <text x="248.4" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">1,500</text>
  <text x="305.2" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2,000</text>
  <text x="362.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2,500</text>
  <line x1="78.0" y1="203.1" x2="191.6" y2="203.1" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="191.6" y1="203.1" x2="191.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="78.0" y1="126.6" x2="305.2" y2="126.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="305.2" y1="126.6" x2="305.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <path d="M134.8,241.4 C144.3,235.0 172.7,215.3 191.6,203.1 C210.5,191.0 229.5,181.4 248.4,168.7 C267.3,155.9 290.1,140.0 305.2,126.6 C320.3,113.2 333.6,94.7 339.3,88.3" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="134.8" cy="241.4" r="3.4" fill="#d9432f"/>
  <circle cx="191.6" cy="203.1" r="3.4" fill="#d9432f"/>
  <circle cx="305.2" cy="126.6" r="3.4" fill="#d9432f"/>
  <circle cx="339.3" cy="88.3" r="3.4" fill="#d9432f"/>
  <text x="347.3" y="78.3" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">S (Supply)</text>
</svg>

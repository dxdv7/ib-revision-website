<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Changing rates of inflation and deflation" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Changing rates of inflation and deflation</title><desc>Line chart of a hypothetical inflation rate, 1999 to 2005: 1.8, 3.1, 2.4, 1.5, 0.6, -0.7 and -0.2 percent. It peaks in 2000, falls every year to 2004 and turns negative from 2004.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="46.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="78.0,41.0 74.2,50.0 81.8,50.0" fill="#2b2b2b"/>
  <line x1="78.0" y1="228.0" x2="384.0" y2="228.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,228.0 380.0,224.2 380.0,231.8" fill="#2b2b2b"/>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Year</text>
  <text x="20.0" y="183.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 183.0)">Inflation rate (%)</text>
  <rect x="79.0" y="228.0" width="305.0" height="90.0" fill="#fbe9e6"/>
  <line x1="78.0" y1="228.0" x2="384.0" y2="228.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,228.0 380.0,224.2 380.0,231.8" fill="#2b2b2b"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="46.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="78.0,41.0 74.2,50.0 81.8,50.0" fill="#2b2b2b"/>
  <text x="70.0" y="322.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">&#8722;2</text>
  <line x1="74.0" y1="318.0" x2="78.0" y2="318.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="70.0" y="277.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">&#8722;1</text>
  <line x1="74.0" y1="273.0" x2="78.0" y2="273.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="70.0" y="232.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <line x1="74.0" y1="228.0" x2="78.0" y2="228.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="70.0" y="187.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">1</text>
  <line x1="74.0" y1="183.0" x2="78.0" y2="183.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="70.0" y="142.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">2</text>
  <line x1="74.0" y1="138.0" x2="78.0" y2="138.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="70.0" y="97.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">3</text>
  <line x1="74.0" y1="93.0" x2="78.0" y2="93.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="70.0" y="52.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">4</text>
  <line x1="74.0" y1="48.0" x2="78.0" y2="48.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="104.9" y1="61.5" x2="104.9" y2="318.0" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <text x="104.9" y="335.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">1999</text>
  <line x1="143.2" y1="61.5" x2="143.2" y2="318.0" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <text x="143.2" y="335.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2000</text>
  <line x1="181.6" y1="61.5" x2="181.6" y2="318.0" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <text x="181.6" y="335.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2001</text>
  <line x1="220.0" y1="61.5" x2="220.0" y2="318.0" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <text x="220.0" y="335.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2002</text>
  <line x1="258.4" y1="61.5" x2="258.4" y2="318.0" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <text x="258.4" y="335.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2003</text>
  <line x1="296.8" y1="61.5" x2="296.8" y2="318.0" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <text x="296.8" y="335.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2004</text>
  <line x1="335.1" y1="61.5" x2="335.1" y2="318.0" stroke="#dddddd" stroke-width="1" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <text x="335.1" y="335.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2005</text>
  <path d="M104.9,147.0 L143.2,88.5 L181.6,120.0 L220.0,160.5 L258.4,201.0 L296.8,259.5 L335.1,237.0" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104.9" cy="147.0" r="3.6" fill="#d9432f"/>
  <circle cx="143.2" cy="88.5" r="3.6" fill="#d9432f"/>
  <circle cx="181.6" cy="120.0" r="3.6" fill="#d9432f"/>
  <circle cx="220.0" cy="160.5" r="3.6" fill="#d9432f"/>
  <circle cx="258.4" cy="201.0" r="3.6" fill="#d9432f"/>
  <circle cx="296.8" cy="259.5" r="3.6" fill="#d9432f"/>
  <circle cx="335.1" cy="237.0" r="3.6" fill="#d9432f"/>
  <text x="216.2" y="99.8" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400" font-style="italic">Disinflation</text>
  <text x="216.2" y="112.8" font-size="10.5" text-anchor="start" fill="#6b6b6b" font-weight="400">(rate falling but still positive)</text>
  <text x="91.4" y="293.2" font-size="11.5" text-anchor="start" fill="#d9432f" font-weight="400">Deflation (negative inflation)</text>
</svg>

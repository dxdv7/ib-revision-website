<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The original Phillips curve" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The original Phillips curve</title><desc>Downward-sloping convex curve with unemployment rate on the horizontal axis and rate of change of wages on the vertical axis: fast wage growth when unemployment is low, wage growth near zero or negative when unemployment is high.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="42.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="78.0,37.0 74.2,46.0 81.8,46.0" fill="#2b2b2b"/>
  <line x1="78.0" y1="278.9" x2="384.0" y2="278.9" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,278.9 380.0,275.1 380.0,282.6" fill="#2b2b2b"/>
  <text x="70.0" y="282.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Unemployment rate</text>
  <text x="20.0" y="181.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 181.0)">Rate of change of wages</text>

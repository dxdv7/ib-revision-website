<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 380" role="img" aria-label="Free trade in coffee (importing case)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Free trade in coffee (importing case)</title><desc>Supply and demand diagram for coffee: S(Domestic) and D intersect at autarky price Pe and quantity Qe, while a horizontal S(World) line at the lower world price Pw shows imports filling the gap between domestic supply Q1 and total quantity demanded Q2.</desc>
  <rect width="430" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of coffee (000 tonnes)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of coffee ($ per kg)</text>
  <line x1="78.0" y1="292.5" x2="353.4" y2="88.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="62.8" x2="353.4" y2="267.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="177.6" x2="232.9" y2="177.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="181.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="232.9" y1="177.6" x2="232.9" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="232.9" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e</tspan></text>
  <circle cx="232.9" cy="177.6" r="3.6" fill="#6b6b6b"/>
  <line x1="78.0" y1="254.2" x2="353.4" y2="254.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="129.6" y1="254.2" x2="129.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="129.6" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="336.2" y1="254.2" x2="336.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="336.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="70.0" y="258.2" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">w</tspan></text>
  <circle cx="129.6" cy="254.2" r="3.6" fill="#2b2b2b"/>
  <circle cx="336.2" cy="254.2" r="3.6" fill="#2b2b2b"/>
  <line x1="133.6" y1="238.2" x2="328.0" y2="238.2" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="332.2,238.2 325.2,235.3 325.2,241.1" fill="#4a3f9f"/>
  <line x1="332.2" y1="238.2" x2="137.8" y2="238.2" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="133.6,238.2 140.6,241.1 140.6,235.3" fill="#4a3f9f"/>
  <text x="232.9" y="230.2" font-size="11" text-anchor="middle" fill="#4a3f9f" font-weight="400">Imports</text>
  <text x="359.4" y="84.3" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S (Domestic)</text>
  <text x="359.4" y="271.0" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="359.4" y="258.2" font-size="11.5" text-anchor="start" fill="#d9432f" font-weight="400">S (World)</text>
</svg>

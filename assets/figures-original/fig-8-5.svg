<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Effect of a specific subsidy on supply" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Effect of a specific subsidy on supply</title><desc>Supply shifts down in parallel by $4,000 at every quantity, from S to S minus subsidy.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity supplied (systems per month)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of home solar systems ($ 000s)</text>
  <line x1="92.2" y1="255.5" x2="333.6" y2="103.6" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="291.2" x2="333.6" y2="139.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="341.6" y="107.6" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="341.6" y="143.3" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S - subsidy</text>
  <line x1="157.5" y1="218.4" x2="157.5" y2="241.3" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="157.5,246.1 160.9,238.1 154.2,238.1" fill="#4a3f9f"/>
  <text x="154.5" y="266.1" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">$4,000</text>
  <line x1="265.4" y1="150.5" x2="265.4" y2="173.4" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="265.4,178.2 268.8,170.2 262.1,170.2" fill="#4a3f9f"/>
  <text x="262.4" y="198.2" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">$4,000</text>
</svg>

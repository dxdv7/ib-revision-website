  <polygon points="125.6,150.0 133.6,153.4 133.6,146.6" fill="#4a3f9f"/>
  <line x1="294.9" y1="252.0" x2="243.7" y2="252.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="238.9,252.0 246.9,255.4 246.9,248.6" fill="#4a3f9f"/>
  <line x1="213.5" y1="304.0" x2="203.7" y2="304.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>

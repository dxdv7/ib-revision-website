  <text x="197.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="110.0" y1="82.0" x2="310.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="93.8" y1="125.0" x2="246.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="110.0" y1="292.0" x2="340.6" y2="96.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="A deflationary gap in the new classical model" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A deflationary gap in the new classical model</title><desc>LRAS at Yf, an upward-sloping SRAS and AD shifting left from AD1 to AD2. In the short run output falls to Y1 below Yf, marked as the deflationary gap.</desc>

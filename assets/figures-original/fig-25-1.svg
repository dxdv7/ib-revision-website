<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" role="img" aria-label="A free-trade area" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A free-trade area</title><desc>Countries A, B and C linked by two-way free-trade arrows inside a shaded free-trade area; outside country D faces a complete embargo from A, tariffs from B and free trade with C.</desc>
  <rect width="500" height="380" fill="#ffffff"/>
  <rect x="18" y="22" width="238" height="336" rx="30" fill="#e6f5f7" stroke="#27b5c2" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="100" cy="90" r="30" fill="#fdeaea" stroke="#d9432f" stroke-width="2.4"/>
  <text x="100.0" y="88.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">Country</text>
  <text x="100.0" y="104.0" font-size="15" text-anchor="middle" fill="#2b2b2b" font-weight="700">A</text>
  <circle cx="100" cy="290" r="30" fill="#fdeaea" stroke="#d9432f" stroke-width="2.4"/>
  <text x="100.0" y="288.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">Country</text>
  <text x="100.0" y="304.0" font-size="15" text-anchor="middle" fill="#2b2b2b" font-weight="700">B</text>
  <circle cx="200" cy="190" r="30" fill="#fdeaea" stroke="#d9432f" stroke-width="2.4"/>
  <text x="200.0" y="188.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">Country</text>
  <text x="200.0" y="204.0" font-size="15" text-anchor="middle" fill="#2b2b2b" font-weight="700">C</text>
  <circle cx="410" cy="190" r="30" fill="#f0f0f0" stroke="#6b6b6b" stroke-width="2.4"/>
  <text x="410.0" y="188.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">Country</text>
  <text x="410.0" y="204.0" font-size="15" text-anchor="middle" fill="#2b2b2b" font-weight="700">D</text>
  <line x1="100.0" y1="128.8" x2="100.0" y2="251.2" stroke="#27b5c2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="100.0,256.0 103.4,248.0 96.6,248.0" fill="#27b5c2"/>
  <polygon points="100.0,124.0 96.6,132.0 103.4,132.0" fill="#27b5c2"/>
  <line x1="127.4" y1="117.4" x2="172.6" y2="162.6" stroke="#27b5c2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="176.0,166.0 172.7,157.9 167.9,162.7" fill="#27b5c2"/>
  <polygon points="124.0,114.0 127.3,122.1 132.1,117.3" fill="#27b5c2"/>
  <line x1="127.4" y1="262.6" x2="172.6" y2="217.4" stroke="#27b5c2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="176.0,214.0 167.9,217.3 172.7,222.1" fill="#27b5c2"/>
  <polygon points="124.0,266.0 132.1,262.7 127.3,257.9" fill="#27b5c2"/>
  <text x="125.0" y="187.0" font-size="11.5" text-anchor="middle" fill="#27b5c2" font-weight="700">FREE-TRADE</text>
  <text x="125.0" y="202.0" font-size="11.5" text-anchor="middle" fill="#27b5c2" font-weight="700">AREA</text>
  <line x1="133.3" y1="100.7" x2="370.0" y2="177.1" stroke="#d9432f" stroke-width="2.2" stroke-linecap="butt" stroke-dasharray="7 5"/>
  <line x1="367.0" y1="186.6" x2="373.1" y2="167.6" stroke="#d9432f" stroke-width="4" stroke-linecap="round"/>
  <text x="330.0" y="137.0" font-size="11.5" text-anchor="middle" fill="#d9432f" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" transform="rotate(17.9 330.0 137.0)">Complete embargo</text>
  <line x1="238.8" y1="190.0" x2="371.2" y2="190.0" stroke="#27b5c2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="376.0,190.0 368.0,186.6 368.0,193.4" fill="#27b5c2"/>
  <polygon points="234.0,190.0 242.0,193.4 242.0,186.6" fill="#27b5c2"/>
  <text x="313.0" y="178.0" font-size="11.5" text-anchor="middle" fill="#27b5c2" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Free trade</text>
  <line x1="133.3" y1="279.3" x2="376.7" y2="200.7" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="133.3,279.3 142.0,280.0 139.9,273.6" fill="#2b2b2b"/>
  <line x1="209.1" y1="264.3" x2="203.6" y2="247.1" stroke="#4a3f9f" stroke-width="4" stroke-linecap="round"/>
  <text x="335.0" y="246.0" font-size="11.5" text-anchor="middle" fill="#4a3f9f" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" transform="rotate(-17.9 335.0 246.0)">Tariffs on D&#8217;s goods</text>
  <text x="387.0" y="252.0" font-size="1" text-anchor="start" fill="#2b2b2b" font-weight="400"></text>
</svg>

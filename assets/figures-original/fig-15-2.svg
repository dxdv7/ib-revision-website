<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The straight-line SRAS curve" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The straight-line SRAS curve</title><desc>A straight upward-sloping SRAS curve. Output Y1 has price level P1 and higher output Y2 has higher price level P2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="78.0" y1="244.0" x2="166.5" y2="244.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="248.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="166.5" y1="244.0" x2="166.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="166.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="126.0" x2="305.3" y2="126.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="130.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="305.3" y1="126.0" x2="305.3" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="305.3" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="110.0" y1="292.0" x2="335.9" y2="100.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="166.5" cy="244.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="305.3" cy="126.0" r="3.6" fill="#2b2b2b"/>
  <line x1="34.0" y1="238.0" x2="34.0" y2="136.2" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="34.0,132.0 31.1,139.0 36.9,139.0" fill="#4a3f9f"/>
  <line x1="178.5" y1="331.0" x2="289.1" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="293.3,331.0 286.3,328.1 286.3,333.9" fill="#4a3f9f"/>
  <text x="341.9" y="104.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" role="img" aria-label="Community surplus" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Community surplus</title><desc>Marginal social benefit (demand) and marginal social cost (supply) curves meeting at point c, with consumer surplus and producer surplus shaded and together making community surplus.</desc>
  <rect width="440" height="390" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="396.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="52.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="401.0,318.0 392.0,314.2 392.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,47.0 74.2,56.0 81.8,56.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="237.0" y="376.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity (000s)</text>
  <text x="20.0" y="185.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 185.0)">Price ($)</text>
  <path d="M78.0,84.3 L78.0,182.7 L196.4,182.7 Z" fill="#bfe3f4" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78.0,182.7 L78.0,281.1 L196.4,182.7 Z" fill="#d3ecc9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="78.0" y1="182.7" x2="196.4" y2="182.7" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="186.7" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P</text>
  <line x1="196.4" y1="182.7" x2="196.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="196.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <line x1="78.0" y1="84.3" x2="359.2" y2="318.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="281.1" x2="305.9" y2="91.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="196.4" cy="182.7" r="3.6" fill="#2b2b2b"/>
  <text x="84.0" y="79.3" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">a</text>
  <text x="83.0" y="177.7" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">b</text>
  <text x="84.0" y="296.1" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">d</text>
  <text x="196.4" y="172.7" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="400">c</text>
  <text x="311.9" y="85.7" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S = MSC</text>
  <text x="363.2" y="310.0" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="400">D = MSB</text>
  <text x="190.5" y="126.1" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Consumer</text>
  <text x="190.5" y="140.1" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">surplus</text>
  <line x1="188.7" y1="136.0" x2="143.7" y2="163.3" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="140.2,165.5 147.7,164.4 144.6,159.3" fill="#4a3f9f"/>
  <text x="166.8" y="244.2" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Producer</text>
  <text x="166.8" y="258.2" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">surplus</text>
  <line x1="165.0" y1="241.7" x2="143.1" y2="220.1" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="140.2,217.1 143.1,224.2 147.2,220.0" fill="#4a3f9f"/>
  <text x="220.0" y="24.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="600">Community surplus = consumer surplus + producer surplus</text>
</svg>

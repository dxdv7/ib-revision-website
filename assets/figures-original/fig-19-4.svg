<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" role="img" aria-label="A fall in employment (structural unemployment)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A fall in employment (structural unemployment)</title><desc>Labour market for call-centre workers: demand falls from D1 to D2 against supply S, cutting employment from Q1 to Q2 and the wage from $15 to $11 per hour.</desc>
  <rect width="420" height="400" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="386.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of call-centre workers</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Call-centre wage ($ per hour)</text>
  <line x1="78.0" y1="72.3" x2="300.5" y2="282.3" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="148.7" x2="219.5" y2="282.3" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="282.3" x2="314.7" y2="85.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="305.5" y="286.3" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="224.5" y="286.3" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="318.7" y="79.7" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <line x1="78.0" y1="184.0" x2="196.3" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="188.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">$15</text>
  <line x1="196.3" y1="184.0" x2="196.3" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="196.3" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="196.3" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="219.8" x2="153.3" y2="219.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="223.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">$11</text>
  <line x1="153.3" y1="219.8" x2="153.3" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="153.3" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="153.3" cy="219.8" r="3.6" fill="#2b2b2b"/>
  <line x1="168.7" y1="161.7" x2="100.5" y2="161.7" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="95.7,161.7 103.7,165.0 103.7,158.3" fill="#4a3f9f"/>
  <line x1="268.1" y1="255.5" x2="199.9" y2="255.5" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="195.1,255.5 203.1,258.8 203.1,252.1" fill="#4a3f9f"/>
  <line x1="186.3" y1="345.0" x2="167.5" y2="345.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="163.3,345.0 170.3,347.9 170.3,342.1" fill="#4a3f9f"/>
  <line x1="38.0" y1="190.0" x2="38.0" y2="209.6" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="38.0,213.8 40.9,206.8 35.1,206.8" fill="#4a3f9f"/>
</svg>

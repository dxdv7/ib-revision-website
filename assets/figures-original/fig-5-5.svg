<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The supply of tennis rackets" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The supply of tennis rackets</title><desc>A single upward-sloping supply curve for tennis rackets with a movement down along it as price falls from P to P1, cutting quantity supplied from Q to Q1.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of tennis rackets</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of tennis rackets ($)</text>
  <line x1="78.0" y1="135.8" x2="271.1" y2="135.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="139.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P</text>
  <line x1="78.0" y1="216.2" x2="185.9" y2="216.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="220.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="271.1" y1="135.8" x2="271.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="271.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <line x1="185.9" y1="216.2" x2="185.9" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="185.9" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="112.1" y1="285.8" x2="339.3" y2="71.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="271.1" cy="135.8" r="3.4" fill="#d9432f"/>
  <circle cx="185.9" cy="216.2" r="3.4" fill="#d9432f"/>
  <text x="345.3" y="65.4" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <line x1="40.0" y1="139.8" x2="40.0" y2="207.4" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="40.0,212.2 43.4,204.2 36.6,204.2" fill="#4a3f9f"/>
  <line x1="267.1" y1="350.0" x2="194.7" y2="350.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="189.9,350.0 197.9,353.4 197.9,346.6" fill="#4a3f9f"/>
</svg>

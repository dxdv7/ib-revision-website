<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Figure 11.1: The demand curves for the industry and the firm in perfect competition" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Figure 11.1: The demand curves for the industry and the firm in perfect competition</title><desc>Two graphs: the industry, where downward-sloping demand D and upward-sloping supply S meet at price P and quantity Q; and the firm, whose demand D = AR = MR is a horizontal line at the industry price P.</desc>

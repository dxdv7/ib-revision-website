  <text x="440.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="602.0" y="374.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Demand-pull inflation" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Demand-pull inflation</title><desc>Aggregate demand shifts right from AD1 to AD2 along SRAS, raising the price level from P1 to P2 and output from Y1 to Y2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="112.0" y1="82.0" x2="300.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="304.0" y="278.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="156.0" y1="62.0" x2="344.0" y2="242.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="348.0" y="258.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="120.0" y1="288.0" x2="330.0" y2="62.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="322.0" y="52.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="183.0" x2="217.5" y2="183.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="187.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="217.5" y1="183.0" x2="217.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="217.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="150.2" x2="248.1" y2="150.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="154.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="248.1" y1="150.2" x2="248.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="248.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="217.5" cy="183.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="248.1" cy="150.2" r="3.6" fill="#2b2b2b"/>
  <line x1="134.8" y1="100.0" x2="186.9" y2="100.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="191.7,100.0 183.7,96.6 183.7,103.4" fill="#4a3f9f"/>
  <line x1="268.5" y1="228.0" x2="320.6" y2="228.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="325.4,228.0 317.4,224.6 317.4,231.4" fill="#4a3f9f"/>
</svg>

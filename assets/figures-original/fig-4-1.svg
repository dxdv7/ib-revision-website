<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="A perfectly inelastic demand curve (PED = 0)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A perfectly inelastic demand curve (PED = 0)</title><desc>A vertical demand curve at quantity Q. Prices P1 and P2 are marked on the price axis and both give the same quantity Q.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity demanded of product</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of product ($)</text>
  <line x1="230.0" y1="60.0" x2="230.0" y2="318.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="215.0" x2="230.0" y2="215.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="219.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="230.0" cy="215.0" r="3.4" fill="#d9432f"/>
  <line x1="78.0" y1="140.0" x2="230.0" y2="140.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="144.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="230.0" cy="140.0" r="3.4" fill="#d9432f"/>
  <text x="230.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <text x="238.0" y="68.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <text x="242.0" y="185.0" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="400">PED = 0</text>
</svg>

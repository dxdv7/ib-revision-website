  <line x1="78.0" y1="247.6" x2="230.0" y2="247.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="251.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">3</tspan></text>
  <line x1="110.0" y1="82.0" x2="310.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>

  <text x="350.8" y="154.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="310.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>

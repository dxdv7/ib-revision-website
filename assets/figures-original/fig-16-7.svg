<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="New classical adjustment - a fall in AD, short run and long run" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>New classical adjustment - a fall in AD, short run and long run</title><desc>After AD falls from AD1 to AD2, SRAS shifts right from SRAS1 to SRAS2, so AD2 meets SRAS2 at Yf again at a lower price level P3 below P2 and P1.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="PED values for a straight-line demand curve" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>PED values for a straight-line demand curve</title><desc>A straight downward-sloping demand line with points a and b near the top marked PED 4.0 (elastic) and points c and d near the bottom marked PED 0.67 (inelastic).</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity (units per week)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price ($)</text>
  <text x="70.0" y="268.4" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">5</text>
  <text x="70.0" y="214.8" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">10</text>
  <text x="70.0" y="161.2" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">15</text>
  <text x="70.0" y="107.6" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">20</text>
  <text x="70.0" y="54.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">25</text>
  <text x="134.8" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">50</text>
  <text x="191.6" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">100</text>
  <text x="248.4" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">150</text>
  <text x="305.2" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">200</text>
  <text x="362.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">250</text>
  <line x1="89.4" y1="60.7" x2="350.6" y2="307.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="358.6" y="311.3" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <circle cx="134.8" cy="103.6" r="3.6" fill="#2b2b2b"/>
  <text x="125.8" y="119.6" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">a</text>
  <circle cx="157.5" cy="125.0" r="3.6" fill="#2b2b2b"/>
  <text x="148.5" y="141.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">b</text>
  <circle cx="248.4" cy="210.8" r="3.6" fill="#2b2b2b"/>
  <text x="239.4" y="226.8" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">c</text>
  <circle cx="271.1" cy="232.2" r="3.6" fill="#2b2b2b"/>
  <text x="262.1" y="248.2" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">d</text>
  <text x="164.3" y="60.7" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">PED = 4.0</text>
  <text x="164.3" y="74.7" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">(elastic)</text>
  <line x1="172.3" y1="80.7" x2="155.6" y2="104.9" stroke="#4a3f9f" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="153.2,108.3 159.6,104.2 154.7,100.9" fill="#4a3f9f"/>
  <text x="266.6" y="135.8" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">PED = 0.67</text>
  <text x="266.6" y="149.8" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">(inelastic)</text>
  <line x1="274.6" y1="155.8" x2="267.3" y2="211.4" stroke="#4a3f9f" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="266.8,215.5 270.6,209.0 264.8,208.2" fill="#4a3f9f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Figure 12.8: CR4 ratios in different market structures" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Figure 12.8: CR4 ratios in different market structures</title><desc>Horizontal spectrum from 0% to 100% market share of the largest four firms (CR4), running from perfect competition at 0% through monopolistic competition and oligopoly to monopoly at 100%.</desc>
  <rect width="460" height="260" fill="#ffffff"/>
  <rect x="40.0" y="130.0" width="152.0" height="34" fill="#d9ecd5" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="192.0" y="130.0" width="171.0" height="34" fill="#f5e2b8" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="363.0" y="130.0" width="57.0" height="34" fill="#f3c7c0" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="40" y="130" width="380" height="34" fill="none" stroke="#2b2b2b" stroke-width="1.6"/>
  <line x1="40.0" y1="130.0" x2="40.0" y2="164.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="40.0" y="182.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">0%</text>
  <line x1="192.0" y1="130.0" x2="192.0" y2="164.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="192.0" y="182.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">40%</text>
  <line x1="363.0" y1="130.0" x2="363.0" y2="164.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="363.0" y="182.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">85%</text>
  <line x1="420.0" y1="130.0" x2="420.0" y2="164.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="420.0" y="182.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">100%</text>
  <text x="230.0" y="204.0" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="400">Market share of the largest 4 firms (CR<tspan font-size="70%" dy="3">4</tspan>)</text>
  <text x="40.0" y="96.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="600">Perfect</text>
  <text x="40.0" y="110.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="600">competition</text>
  <text x="116.0" y="118.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="600">Monopolistic</text>
  <text x="116.0" y="132.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="600">competition</text>
  <text x="277.5" y="110.0" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Oligopoly</text>
  <text x="420.0" y="96.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="600">Monopoly</text>
  <circle cx="40.0" cy="147.0" r="4.4" fill="#2b2b2b"/>
  <circle cx="420.0" cy="147.0" r="4.4" fill="#2b2b2b"/>
  <text x="116.0" y="224.0" font-size="10.5" text-anchor="middle" fill="#555555" font-weight="400" font-style="italic">Low concentration</text>
  <text x="277.5" y="224.0" font-size="10.5" text-anchor="middle" fill="#555555" font-weight="400" font-style="italic">Medium concentration</text>
  <text x="391.5" y="224.0" font-size="10.5" text-anchor="middle" fill="#555555" font-weight="400" font-style="italic">High concentration</text>
  <text x="230.0" y="30.0" font-size="15" text-anchor="middle" fill="#2b2b2b" font-weight="600">The market-structure spectrum</text>
</svg>

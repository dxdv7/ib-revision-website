  <line x1="640.0" y1="318.0" x2="640.0" y2="92.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="716.0" y1="318.0" x2="716.0" y2="92.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="640.0" y="82.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">LRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="716.0" y="82.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">LRAS<tspan font-size="70%" dy="3">2</tspan></text>

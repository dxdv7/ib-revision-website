<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Effect of supply-side policies on aggregate supply" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Effect of supply-side policies on aggregate supply</title><desc>Two panels. (a) A Keynesian-shaped short-run aggregate supply curve, flat at low output and vertical at full capacity, shifts right from AS1 to AS2. (b) A vertical long-run aggregate supply curve shifts right from LRAS1 to LRAS2. Both axes show average price level against real output.</desc>
  <rect width="860" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="390.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="50.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="395.0,318.0 386.0,314.2 386.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,45.0 74.2,54.0 81.8,54.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="234.0" y="358.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 184.0)">Average price level ($)</text>
  <text x="234.0" y="34.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">(a)</text>
  <path d="M88.0,250.0 L242.0,250.0 C283.6,250.0 306.0,215.2 306.0,192.0 L306.0,92.0" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88.0,250.0 L168.0,250.0 C209.6,250.0 232.0,215.2 232.0,192.0 L232.0,92.0" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="232.0" y="82.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">AS<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="306.0" y="82.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">AS<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="236.0" y1="148.0" x2="297.2" y2="148.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="302.0,148.0 294.0,144.6 294.0,151.4" fill="#4a3f9f"/>
  <line x1="498.0" y1="318.0" x2="810.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="498.0" y1="318.0" x2="498.0" y2="50.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="815.0,318.0 806.0,314.2 806.0,321.8" fill="#2b2b2b"/>
  <polygon points="498.0,45.0 494.2,54.0 501.8,54.0" fill="#2b2b2b"/>
  <text x="486.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="654.0" y="358.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="440.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 440 184.0)">Average price level ($)</text>

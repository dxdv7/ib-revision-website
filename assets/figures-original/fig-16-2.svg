<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="New classical perspective of long-run equilibrium" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>New classical perspective of long-run equilibrium</title><desc>A vertical LRAS line at output Yf crossed by a downward-sloping AD1 curve at price level P1.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="78.0" y1="190.0" x2="230.0" y2="190.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="194.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="230.0" y1="190.0" x2="230.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="230.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size='70%' dy='3'>f</tspan></text>
  <line x1="110.0" y1="82.0" x2="310.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="230.0" y1="318.0" x2="230.0" y2="48.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="230.0" cy="190.0" r="3.6" fill="#2b2b2b"/>
  <text x="230.0" y="38.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">LRAS</text>
  <text x="318.0" y="274.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
</svg>

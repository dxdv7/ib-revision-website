<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-label="Circular flow of income (five sectors)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Circular flow of income (five sectors)</title><desc>Circular flow of income with households and firms, plus government, financial institutions and foreign sector, each with a red leakage arrow out and a teal injection arrow in.</desc>
  <rect width="640" height="410" fill="#ffffff"/>
  <rect x="90" y="30" width="120" height="46" rx="6" fill="#fdeaea" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="150.0" y="58.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">Households</text>
  <rect x="90" y="300" width="120" height="46" rx="6" fill="#fdeaea" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="150.0" y="328.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">Firms</text>
  <line x1="88.0" y1="53.0" x2="32.0" y2="53.0" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="32.0" y1="53.0" x2="32.0" y2="323.0" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="32.0" y1="323.0" x2="83.2" y2="323.0" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="88.0,323.0 80.0,319.6 80.0,326.4" fill="#4a3f9f"/>
  <line x1="212.0" y1="323.0" x2="270.0" y2="323.0" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="270.0" y1="323.0" x2="270.0" y2="53.0" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="270.0" y1="53.0" x2="216.8" y2="53.0" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="212.0,53.0 220.0,56.4 220.0,49.6" fill="#4a3f9f"/>
  <text x="22.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 22 190)">Expenditure on goods and services</text>
  <text x="262.0" y="178.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">Wages, rent,</text>
  <text x="262.0" y="194.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">interest and</text>
  <text x="262.0" y="210.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">profits</text>
  <rect x="452" y="60" width="160" height="66" rx="6" fill="#eef7f8" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="532.0" y="98.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">Government</text>
  <line x1="274.0" y1="78.0" x2="443.2" y2="78.0" stroke="#d9432f" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="448.0,78.0 440.0,74.6 440.0,81.4" fill="#d9432f"/>
  <text x="361.0" y="72.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Taxes</text>
  <line x1="448.0" y1="108.0" x2="278.8" y2="108.0" stroke="#1a95a1" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="274.0,108.0 282.0,111.4 282.0,104.6" fill="#1a95a1"/>
  <text x="361.0" y="124.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Government spending</text>
  <rect x="452" y="155" width="160" height="66" rx="6" fill="#eef7f8" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="532.0" y="185.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">Financial</text>
  <text x="532.0" y="201.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">institutions</text>
  <line x1="274.0" y1="173.0" x2="443.2" y2="173.0" stroke="#d9432f" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="448.0,173.0 440.0,169.6 440.0,176.4" fill="#d9432f"/>
  <text x="361.0" y="167.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Saving</text>
  <line x1="448.0" y1="203.0" x2="278.8" y2="203.0" stroke="#1a95a1" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="274.0,203.0 282.0,206.4 282.0,199.6" fill="#1a95a1"/>
  <text x="361.0" y="219.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Investment</text>
  <rect x="452" y="250" width="160" height="66" rx="6" fill="#eef7f8" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="532.0" y="280.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">Foreign</text>
  <text x="532.0" y="296.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">sector</text>
  <line x1="274.0" y1="268.0" x2="443.2" y2="268.0" stroke="#d9432f" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="448.0,268.0 440.0,264.6 440.0,271.4" fill="#d9432f"/>
  <text x="361.0" y="262.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Spending on imports</text>
  <line x1="448.0" y1="298.0" x2="278.8" y2="298.0" stroke="#1a95a1" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="274.0,298.0 282.0,301.4 282.0,294.6" fill="#1a95a1"/>
  <text x="361.0" y="314.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Revenue from exports</text>
  <line x1="30.0" y1="396.0" x2="61.2" y2="396.0" stroke="#4a3f9f" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="66.0,396.0 58.0,392.6 58.0,399.4" fill="#4a3f9f"/>
  <text x="74.0" y="400.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">Income and spending</text>
  <line x1="230.0" y1="396.0" x2="261.2" y2="396.0" stroke="#d9432f" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="266.0,396.0 258.0,392.6 258.0,399.4" fill="#d9432f"/>
  <text x="274.0" y="400.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">Leakage (out of the flow)</text>
  <line x1="440.0" y1="396.0" x2="471.2" y2="396.0" stroke="#1a95a1" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="476.0,396.0 468.0,392.6 468.0,399.4" fill="#1a95a1"/>
  <text x="484.0" y="400.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">Injection (into the flow)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img" aria-label="An increase in the supply of EC$" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>An increase in the supply of EC$</title><desc>Demand and supply diagram for the Eastern Caribbean dollar (EC$) showing the supply curve shifting rightward from S1 to S2 at the fixed exchange rate of US$0.40, creating excess supply of EC$.</desc>
  <rect width="460" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of EC$ (millions per period)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of EC$ in US$</text>
  <line x1="78.0" y1="83.5" x2="362.0" y2="284.5" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="251.0" x2="362.0" y2="117.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="277.8" x2="362.0" y2="150.5" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="184.0" x2="384.0" y2="184.0" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
  <circle cx="220.0" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <line x1="220.0" y1="184.0" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="291.0" cy="184.0" r="3.6" fill="#d9432f"/>
  <line x1="291.0" y1="184.0" x2="291.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="291.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="70.0" y="188.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">0.40</text>
  <line x1="223.0" y1="184.0" x2="288.0" y2="184.0" stroke="#3fb1e3" stroke-width="4.5" stroke-linecap="round"/>
  <text x="255.5" y="204.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Excess supply</text>
  <line x1="259.5" y1="167.2" x2="317.7" y2="167.2" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="322.5,167.2 314.5,163.9 314.5,170.6" fill="#4a3f9f"/>
  <text x="293.0" y="154.6" font-size="11" text-anchor="middle" fill="#4a3f9f" font-weight="600">S<tspan font-size="70%" dy="3">1</tspan>→S<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="368.0" y="288.5" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="368.0" y="121.0" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="368.0" y="154.5" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="380.0" y="176.0" font-size="10.5" text-anchor="end" fill="#2b2b2b" font-weight="400">Fixed rate</text>
</svg>

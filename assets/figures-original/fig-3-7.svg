<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The demand for reusable shopping bags (a shift)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The demand for reusable shopping bags (a shift)</title><desc>Two parallel downward-sloping demand curves for reusable shopping bags, D and D1, with D1 to the right, and purple arrows showing the rightward shift.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of reusable shopping bags</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of reusable shopping bags ($)</text>
  <line x1="100.0" y1="64.0" x2="300.0" y2="264.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="304.0" y="280.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <line x1="175.0" y1="64.0" x2="375.0" y2="264.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="380.0" y="280.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="150.0" x2="186.0" y2="150.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="154.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">p</text>
  <line x1="186.0" y1="150.0" x2="186.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="186.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q</text>
  <line x1="78.0" y1="150.0" x2="261.0" y2="150.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="261.0" y1="150.0" x2="261.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="261.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="186.0" cy="150.0" r="3.4" fill="#d9432f"/>
  <circle cx="261.0" cy="150.0" r="3.4" fill="#d9432f"/>
  <line x1="132.0" y1="92.0" x2="194.2" y2="92.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="199.0,92.0 191.0,88.6 191.0,95.4" fill="#4a3f9f"/>
  <line x1="162.0" y1="122.0" x2="224.2" y2="122.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="229.0,122.0 221.0,118.6 221.0,125.4" fill="#4a3f9f"/>
  <line x1="198.0" y1="331.0" x2="244.8" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="249.0,331.0 242.0,328.1 242.0,333.9" fill="#4a3f9f"/>
</svg>

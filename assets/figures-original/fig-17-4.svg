<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Open market operations" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Open market operations</title><desc>Loanable funds market: a downward-sloping demand curve D and two vertical supply curves, S1 on the left and S2 on the right. Arrows show buying securities moving supply from S1 to S2 and selling securities moving it back.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of loanable funds</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Interest rate</text>
  <line x1="78.0" y1="139.6" x2="185.0" y2="139.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="143.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="216.9" x2="270.0" y2="216.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="220.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="104.0" y1="66.0" x2="346.0" y2="286.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="185.0" y1="318.0" x2="185.0" y2="54.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="185.0" y="46.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="270.0" y1="318.0" x2="270.0" y2="54.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="270.0" y="46.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="185.0" cy="139.6" r="3.6" fill="#2b2b2b"/>
  <circle cx="270.0" cy="216.9" r="3.6" fill="#2b2b2b"/>
  <text x="354.0" y="290.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="227.5" y="236.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Buying</text>
  <text x="227.5" y="249.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">securities</text>
  <line x1="190.0" y1="259.0" x2="260.2" y2="259.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="265.0,259.0 257.0,255.6 257.0,262.4" fill="#4a3f9f"/>
  <text x="227.5" y="279.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Selling</text>
  <text x="227.5" y="292.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">securities</text>
  <line x1="265.0" y1="302.0" x2="194.8" y2="302.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="190.0,302.0 198.0,305.4 198.0,298.6" fill="#4a3f9f"/>
</svg>

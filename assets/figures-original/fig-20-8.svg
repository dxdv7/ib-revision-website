<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The Phillips curve as usually drawn" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The Phillips curve as usually drawn</title><desc>Downward-sloping short-run Phillips curve with inflation rate on the vertical axis and unemployment rate on the horizontal axis. Point A is 6% unemployment and 3% inflation; point B is 4% unemployment and 7% inflation.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="42.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>

  <text x="204.2" y="297.2" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">6</text>
  <line x1="78.0" y1="170.0" x2="162.1" y2="170.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="174.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">7</text>
  <line x1="162.1" y1="170.0" x2="162.1" y2="280.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="162.1" y="297.2" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">4</text>

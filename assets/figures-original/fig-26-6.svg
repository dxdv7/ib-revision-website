<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img" aria-label="An increase in the supply of the Australian dollar" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>An increase in the supply of the Australian dollar</title><desc>Demand and supply diagram for Australian dollars priced in Singapore dollars, with the supply curve shifting rightward from S1 to S2, lowering the equilibrium price from 0.90 to 0.80 Singapore dollars.</desc>
  <rect width="460" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of A$</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of A$ in S$</text>
  <line x1="78.0" y1="100.2" x2="362.0" y2="247.6" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="234.2" x2="362.0" y2="86.9" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="267.8" x2="362.0" y2="120.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="167.3" x2="207.1" y2="167.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="171.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="207.1" y1="167.3" x2="207.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="207.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="207.1" cy="167.3" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="184.0" x2="239.4" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="188.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="239.4" y1="184.0" x2="239.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="239.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="239.4" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <line x1="275.6" y1="133.7" x2="327.4" y2="133.7" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="332.2,133.7 324.2,130.4 324.2,137.1" fill="#4a3f9f"/>
  <text x="336.2" y="122.7" font-size="11" text-anchor="middle" fill="#4a3f9f" font-weight="600">S<tspan font-size="70%" dy="3">1</tspan>→S<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="368.0" y="251.6" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="368.0" y="90.9" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="368.0" y="124.4" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="155.5" y="100.2" font-size="12" text-anchor="middle" fill="#4a3f9f" font-weight="600">Depreciation of A$</text>
</svg>

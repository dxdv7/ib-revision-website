<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The market for lithium" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The market for lithium</title><desc>Steep, inelastic lithium supply curve with demand shifting right from D1 to D2, raising price from $12,000 to $24,000 per tonne while quantity rises only from 40 to 48 thousand tonnes.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of lithium (thousand tonnes)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of lithium ($000 per tonne)</text>
  <line x1="78.0" y1="246.5" x2="220.0" y2="246.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="250.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">12</text>
  <line x1="220.0" y1="246.5" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">40</text>
  <line x1="78.0" y1="175.1" x2="248.4" y2="175.1" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="179.1" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">24</text>
  <line x1="248.4" y1="175.1" x2="248.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="248.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">48</text>
  <line x1="131.2" y1="127.4" x2="255.5" y2="294.2" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="166.8" y1="65.5" x2="326.5" y2="279.9" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="198.7" y1="300.1" x2="276.8" y2="103.6" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="220.0" cy="246.5" r="3.6" fill="#2b2b2b"/>
  <circle cx="248.4" cy="175.1" r="3.6" fill="#2b2b2b"/>
  <line x1="153.0" y1="151.2" x2="221.8" y2="151.2" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="226.6,151.2 218.6,147.9 218.6,154.6" fill="#4a3f9f"/>
  <line x1="215.1" y1="234.6" x2="284.0" y2="234.6" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="288.8,234.6 280.8,231.3 280.8,238.0" fill="#4a3f9f"/>
  <text x="282.8" y="99.6" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">Supply</text>
  <text x="259.5" y="308.2" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <text x="330.5" y="293.9" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">2</tspan><tspan dy="-3"></tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Non-inflationary growth" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Non-inflationary growth</title><desc>AD/AS diagram: LRAS shifts right from LRAS1 to LRAS2 and AD shifts right from AD1 to AD2 by a matching amount, so output rises from Yf1 to Yf2 with no change in the average price level.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="180.0" y1="318.0" x2="180.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="280.0" y1="318.0" x2="280.0" y2="30.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="140.0" y="22.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">LRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="286.0" y="22.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">LRAS<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="100.0" y1="100.0" x2="300.0" y2="300.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="304.0" y="304.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="170.0" y1="70.0" x2="370.0" y2="270.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="374.0" y="274.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="78.0" y1="180.0" x2="288.0" y2="180.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <circle cx="180.0" cy="180.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="280.0" cy="180.0" r="3.6" fill="#2b2b2b"/>
  <text x="70.0" y="184.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P</text>
  <text x="180.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">f1</tspan></text>
  <text x="280.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">f2</tspan></text>
  <line x1="186.0" y1="44.0" x2="269.2" y2="44.0" stroke="#4a3f9f" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="274.0,44.0 266.0,40.6 266.0,47.4" fill="#4a3f9f"/>
</svg>

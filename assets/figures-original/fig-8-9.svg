<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" role="img" aria-label="Minimum price on milk" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Minimum price on milk</title><desc>A price floor of $18 above the $12 equilibrium: quantity supplied 80 exceeds quantity demanded 30, leaving excess supply.</desc>
  <rect width="440" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of milk (million crates)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of milk ($ per crate)</text>
  <line x1="92.2" y1="90.2" x2="319.4" y2="304.6" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="291.2" x2="347.8" y2="130.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="327.4" y="308.6" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="355.8" y="134.4" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <line x1="78.0" y1="210.8" x2="220.0" y2="210.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="214.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="220.0" y1="210.8" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e</tspan></text>
  <circle cx="220.0" cy="210.8" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="157.2" x2="362.0" y2="157.2" stroke="#1f4e9c" stroke-width="2.6" stroke-linecap="round"/>
  <text x="370.0" y="155.2" font-size="12" text-anchor="start" fill="#1f4e9c" font-weight="600">Minimum</text>
  <text x="370.0" y="170.2" font-size="12" text-anchor="start" fill="#1f4e9c" font-weight="600">price</text>
  <text x="70.0" y="161.2" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">min</tspan></text>
  <line x1="163.2" y1="157.2" x2="163.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="163.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="305.2" y1="157.2" x2="305.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="305.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="163.2" cy="157.2" r="3.6" fill="#2b2b2b"/>
  <circle cx="305.2" cy="157.2" r="3.6" fill="#2b2b2b"/>
  <path d="M165.2,151.2 Q165.2,144.2 172.2,144.2 L227.2,144.2 Q234.2,144.2 234.2,137.2 Q234.2,144.2 241.2,144.2 L296.2,144.2 Q303.2,144.2 303.2,151.2" fill="none" stroke="#27b5c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="234.2" y="131.2" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="400">Excess supply</text>

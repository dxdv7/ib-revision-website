<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Consumer surplus in the market for vinyl records" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Consumer surplus in the market for vinyl records</title><desc>Demand and supply for vinyl records with the triangle above the $12 price and below the demand curve shaded as consumer surplus, labelled a, b and c.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of vinyl records (hundreds per week)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price per record ($)</text>
  <text x="70.0" y="143.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">20</text>
  <text x="70.0" y="54.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">30</text>
  <text x="149.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">5</text>
  <text x="220.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">10</text>
  <text x="291.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">15</text>
  <text x="362.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">20</text>
  <path d="M78.0,50.0 L78.0,210.8 L248.4,210.8 Z" fill="#bfe3f4" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="78.0" y1="210.8" x2="248.4" y2="210.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="214.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">12</text>
  <line x1="248.4" y1="210.8" x2="248.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="248.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">12</text>
  <line x1="78.0" y1="50.0" x2="362.0" y2="318.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="291.2" x2="362.0" y2="157.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="248.4" cy="210.8" r="3.6" fill="#2b2b2b"/>
  <text x="368.0" y="312.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="368.0" y="151.2" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="84.0" y="45.0" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">a</text>
  <text x="83.0" y="225.8" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">c</text>
  <text x="248.4" y="200.8" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="400">b</text>
  <text x="174.6" y="81.3" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Consumer</text>
  <text x="174.6" y="95.3" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">surplus</text>
  <line x1="171.7" y1="90.2" x2="127.5" y2="145.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="124.9,148.3 131.5,144.7 127.0,141.0" fill="#4a3f9f"/>
</svg>

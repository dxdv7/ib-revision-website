  <text x="700.0" y="136.5" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Intergenerational equity</text>
  <text x="700.0" y="151.9" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">and sustainability</text>
  <rect x="10.0" y="216.0" width="120.0" height="48.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="70.0" y="243.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">GDP (per capita)</text>
  <rect x="150.0" y="216.0" width="120.0" height="48.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="210.0" y="243.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">Labour productivity</text>
  <rect x="290.0" y="216.0" width="120.0" height="48.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>

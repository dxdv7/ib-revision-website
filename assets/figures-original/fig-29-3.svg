  <text x="490.0" y="243.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">Income Gini coefficient</text>
  <rect x="570.0" y="216.0" width="120.0" height="48.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="630.0" y="243.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">Adjusted net savings</text>
  <rect x="710.0" y="216.0" width="120.0" height="48.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="770.0" y="243.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">Dependency ratio</text>
  <rect x="10.0" y="321.0" width="120.0" height="48.0" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2.0"/>
  <text x="70.0" y="348.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">Employment</text>
  <rect x="150.0" y="321.0" width="120.0" height="48.0" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2.0"/>
  <text x="210.0" y="348.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">Healthy life expectancy</text>
  <rect x="290.0" y="321.0" width="120.0" height="48.0" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2.0"/>
  <text x="350.0" y="348.5" font-size="10" text-anchor="middle" fill="#2b2b2b" font-weight="600">Poverty rate</text>
  <rect x="430.0" y="321.0" width="120.0" height="48.0" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2.0"/>

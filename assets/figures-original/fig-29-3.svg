<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-label="The elements of the IDI" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The elements of the IDI</title><desc>Organisation chart showing national key performance indicators split into three pillars: growth and development, inclusion, and intergenerational equity and sustainability, each with two headline indicators and a further supporting indicator.</desc>
  <rect width="880" height="440" fill="#ffffff"/>
  <rect x="280.0" y="18.0" width="280.0" height="44.0" rx="8" fill="#f8d3cd" stroke="#d9432f" stroke-width="2.4"/>
  <text x="420.0" y="44.2" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">National key performance indicators</text>
  <rect x="40.0" y="117.0" width="200.0" height="46.0" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.0"/>
  <text x="140.0" y="144.2" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Growth and development</text>

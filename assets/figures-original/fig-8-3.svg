<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" role="img" aria-label="Specific tax with elastic demand and inelastic supply" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Specific tax with elastic demand and inelastic supply</title><desc>Flat demand and steep supply: a $8 tax moves the price only from $17 to $19, so producers bear most of it.</desc>
  <rect width="420" height="430" fill="#ffffff"/>
  <g transform="translate(0,0)">
  <polygon points="78.0,158.9 163.2,158.9 163.2,175.6 78.0,175.6" fill="#f6d9a0" stroke="none"/>
  <polygon points="78.0,175.6 163.2,175.6 163.2,225.9 78.0,225.9" fill="#b4e3e9" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of concert tickets (000s)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of concert tickets ($)</text>
  <line x1="78.0" y1="175.6" x2="220.0" y2="175.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="179.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="220.0" y1="175.6" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="78.0" y1="158.9" x2="163.2" y2="158.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="162.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="163.2" y1="158.9" x2="163.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="163.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="225.9" x2="163.2" y2="225.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="229.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">C</text>
  <line x1="106.4" y1="142.1" x2="362.0" y2="217.5" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="301.2" x2="333.6" y2="75.1" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="234.2" x2="254.1" y2="78.5" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="370.0" y="221.5" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="341.6" y="79.1" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="262.1" y="82.5" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S + tax</text>
  <circle cx="220.0" cy="175.6" r="3.6" fill="#2b2b2b"/>
  <circle cx="163.2" cy="158.9" r="3.6" fill="#2b2b2b"/>

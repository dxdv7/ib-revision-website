  <text x="163.2" y="149.9" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">X</text>
  <text x="170.2" y="239.9" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Y</text>
  <line x1="234.2" y1="159.1" x2="234.2" y2="104.9" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="234.2,100.1 230.8,108.1 237.6,108.1" fill="#4a3f9f"/>
  <text x="242.2" y="133.6" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">$8</text>
  </g>
  <rect x="96" y="386" width="16" height="11" fill="#f6d9a0" stroke="#9a9a9a" stroke-width="0.7"/>
  <text x="121.0" y="396.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Tax burden on consumers</text>
  <rect x="96" y="405" width="16" height="11" fill="#b4e3e9" stroke="#9a9a9a" stroke-width="0.7"/>
  <text x="121.0" y="415.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Tax burden on producers</text>
</svg>

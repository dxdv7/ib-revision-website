  <line x1="226.0" y1="345.0" x2="184.2" y2="345.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="180.0,345.0 187.0,347.9 187.0,342.1" fill="#4a3f9f"/>
</svg>

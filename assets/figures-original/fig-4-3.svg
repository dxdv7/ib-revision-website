<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The demand for bus passes (inelastic, revenue rises)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The demand for bus passes (inelastic, revenue rises)</title><desc>A downward-sloping demand curve for bus passes with shaded revenue areas a, b and c. Price rises from $50 to $60 and quantity falls from 10,000 to 9,000.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <rect x="78.0" y="184.0" width="213.0" height="22.3" fill="#e2f3e4"/>
  <rect x="291.0" y="206.3" width="23.7" height="111.7" fill="#fbe3df"/>
  <rect x="78.0" y="206.3" width="213.0" height="111.7" fill="#efefef"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of bus passes (000s per month)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of a bus pass ($)</text>
  <line x1="78.0" y1="206.3" x2="314.7" y2="206.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="210.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">50</text>
  <line x1="314.7" y1="206.3" x2="314.7" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="314.7" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">10</text>
  <line x1="78.0" y1="184.0" x2="291.0" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="188.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">60</text>
  <line x1="291.0" y1="184.0" x2="291.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="291.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">9</text>
  <line x1="172.7" y1="72.3" x2="362.0" y2="251.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="314.7" cy="206.3" r="3.4" fill="#d9432f"/>
  <circle cx="291.0" cy="184.0" r="3.4" fill="#d9432f"/>
  <text x="368.0" y="255.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <text x="184.5" y="200.2" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="400">a</text>
  <text x="184.5" y="264.4" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="400">b</text>
  <text x="302.8" y="264.4" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="400">c</text>
  <line x1="42.0" y1="202.3" x2="42.0" y2="192.2" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="42.0,188.0 39.1,195.0 44.9,195.0" fill="#4a3f9f"/>
  <line x1="309.7" y1="349.0" x2="300.2" y2="349.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="296.0,349.0 303.0,351.9 303.0,346.1" fill="#4a3f9f"/>
</svg>

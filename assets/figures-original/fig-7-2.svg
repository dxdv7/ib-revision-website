<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="The market for tea (disequilibrium and adjustment)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The market for tea (disequilibrium and adjustment)</title><desc>Two diagrams of the tea market: (a) a price P1 above equilibrium creates excess supply Q2 minus Q1 and pushes price down; (b) a price P2 below equilibrium creates excess demand Q4 minus Q3 and pushes price up.</desc>

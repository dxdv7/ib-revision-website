  <circle cx="706.8" cy="237.6" r="3.4" fill="#d9432f"/>
  <circle cx="586.1" cy="237.6" r="3.4" fill="#d9432f"/>
  <path d="M586.1,243.6 Q586.1,248.1 595.1,248.1 L637.4,248.1 Q646.4,248.1 646.4,252.6 Q646.4,248.1 655.4,248.1 L697.8,248.1 Q706.8,248.1 706.8,243.6" fill="none" stroke="#3fb1e3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

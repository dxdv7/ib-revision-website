  <text x="648.6" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e</tspan><tspan dy="-3"></tspan></text>
  <line x1="586.1" y1="237.6" x2="586.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="586.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">3</tspan><tspan dy="-3"></tspan></text>
  <line x1="706.8" y1="237.6" x2="706.8" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="706.8" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">4</tspan><tspan dy="-3"></tspan></text>
  <line x1="525.0" y1="66.1" x2="769.3" y2="296.6" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="525.0" y1="291.2" x2="769.3" y2="76.8" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>

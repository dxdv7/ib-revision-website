  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of tea (tonnes per week)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of tea ($ per kg)</text>
  <text x="90.0" y="20.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="600">(a)</text>

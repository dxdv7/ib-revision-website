<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Demand-pull inflation" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Demand-pull inflation</title><desc>AD/AS diagram: aggregate demand shifts right from AD1 to AD2 along the upward-sloping SRAS curve, raising the price level from P1 to P2 and real output from Y1 to Y2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="104.0" y1="84.0" x2="296.0" y2="264.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="156.0" y1="76.0" x2="348.0" y2="256.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="118.0" y1="292.0" x2="334.0" y2="58.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="301.0" y="270.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="353.0" y="262.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="326.0" y="50.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS</text>
  <line x1="78.0" y1="187.5" x2="214.4" y2="187.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="191.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="214.4" y1="187.5" x2="214.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="214.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="214.4" cy="187.5" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="157.1" x2="242.5" y2="157.1" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="161.1" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="242.5" y1="157.1" x2="242.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="242.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="242.5" cy="157.1" r="3.6" fill="#2b2b2b"/>
  <line x1="133.6" y1="108.0" x2="181.3" y2="108.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="186.1,108.0 178.1,104.6 178.1,111.4" fill="#4a3f9f"/>
  <line x1="259.5" y1="226.0" x2="307.2" y2="226.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="312.0,226.0 304.0,222.6 304.0,229.4" fill="#4a3f9f"/>
  <line x1="224.4" y1="345.0" x2="228.3" y2="345.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="232.5,345.0 225.5,342.1 225.5,347.9" fill="#4a3f9f"/>
  <line x1="40.0" y1="181.5" x2="40.0" y2="167.3" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="40.0,163.1 37.1,170.1 42.9,170.1" fill="#4a3f9f"/>
</svg>

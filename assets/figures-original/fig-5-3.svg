  <text x="520.0" y="20.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="600" font-style="italic">Supply of paddleboards</text>
  <line x1="508.0" y1="210.8" x2="688.2" y2="210.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>

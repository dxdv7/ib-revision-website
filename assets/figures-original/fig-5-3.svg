  <line x1="508.0" y1="318.0" x2="814.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="508.0" y1="318.0" x2="508.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="819.0,318.0 810.0,314.2 810.0,321.8" fill="#2b2b2b"/>

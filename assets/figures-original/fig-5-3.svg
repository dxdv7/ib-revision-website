  <line x1="658.7" y1="264.4" x2="609.1" y2="264.4" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="604.3,264.4 612.3,267.8 612.3,261.0" fill="#4a3f9f"/>

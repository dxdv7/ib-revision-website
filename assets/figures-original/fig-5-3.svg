<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="The supply of kayaks and paddleboards" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The supply of kayaks and paddleboards</title><desc>Two diagrams: a movement up along the kayak supply curve as price rises from P to P1, and a leftward shift of the paddleboard supply curve from S to S1 at an unchanged price.</desc>
  <rect width="860" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price ($)</text>
  <text x="90.0" y="20.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="600" font-style="italic">Supply of kayaks</text>
  <line x1="78.0" y1="237.6" x2="174.4" y2="237.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="241.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P</text>
  <line x1="78.0" y1="143.8" x2="279.0" y2="143.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="147.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="174.4" y1="237.6" x2="174.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="174.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <line x1="279.0" y1="143.8" x2="279.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="279.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="120.6" y1="285.8" x2="347.8" y2="82.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="174.4" cy="237.6" r="3.4" fill="#d9432f"/>
  <circle cx="279.0" cy="143.8" r="3.4" fill="#d9432f"/>
  <text x="353.8" y="76.2" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>

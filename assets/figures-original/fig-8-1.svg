<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Specific versus percentage tax on supply" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Specific versus percentage tax on supply</title><desc>Two panels. A specific tax shifts supply up in parallel by $3; a 25% tax shifts it up by $2 at a price of $8 and $4 at a price of $16.</desc>
  <rect width="860" height="380" fill="#ffffff"/>
  <g transform="translate(0,0)">
  <line x1="78.0" y1="318.0" x2="392.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="44.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="397.0,318.0 388.0,314.2 388.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,39.0 74.2,48.0 81.8,48.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="235.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of a good</text>
  <text x="20.0" y="181.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 181.0)">Price ($)</text>
  <text x="235.0" y="20.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" font-style="italic">(a) A specific tax ($3 per unit)</text>
  <line x1="107.2" y1="258.7" x2="340.8" y2="123.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="107.2" y1="284.1" x2="340.8" y2="148.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="348.8" y="152.7" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="348.8" y="127.3" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S + tax</text>
  <line x1="165.6" y1="246.3" x2="165.6" y2="233.7" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="165.6,228.9 162.2,236.9 169.0,236.9" fill="#4a3f9f"/>
  <text x="168.6" y="217.9" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">$3</text>
  <line x1="282.4" y1="178.5" x2="282.4" y2="165.9" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="282.4,161.1 279.0,169.1 285.8,169.1" fill="#4a3f9f"/>
  <text x="285.4" y="150.1" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">$3</text>
  </g>
  <g transform="translate(430,0)">
  <line x1="78.0" y1="318.0" x2="392.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="44.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="397.0,318.0 388.0,314.2 388.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,39.0 74.2,48.0 81.8,48.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="235.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of a good</text>
  <text x="20.0" y="181.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 181.0)">Price ($)</text>
  <text x="235.0" y="20.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" font-style="italic">(b) A percentage tax (25% of price)</text>
  <line x1="78.0" y1="250.3" x2="165.6" y2="250.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="254.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">8</text>
  <line x1="78.0" y1="182.5" x2="282.4" y2="182.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="186.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">16</text>
  <line x1="107.2" y1="275.7" x2="340.8" y2="106.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="107.2" y1="284.1" x2="340.8" y2="148.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="348.8" y="152.7" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="348.8" y="110.3" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S + tax</text>
  <line x1="165.6" y1="246.3" x2="165.6" y2="242.1" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="165.6,237.3 162.2,245.3 169.0,245.3" fill="#4a3f9f"/>
  <text x="168.6" y="226.3" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">$2</text>
  <line x1="282.4" y1="178.5" x2="282.4" y2="157.5" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="282.4,152.7 279.0,160.7 285.8,160.7" fill="#4a3f9f"/>
  <text x="285.4" y="141.7" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">$4</text>
  </g>
</svg>

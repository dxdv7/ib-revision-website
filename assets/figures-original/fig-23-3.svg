<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Identical opportunity costs" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Identical opportunity costs</title><desc>Two parallel straight-line PPCs on rice and textiles axes with the same slope: Thailand's line further from the origin than Peru's, showing identical opportunity costs and therefore no gains from trade.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Textiles (bales)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Rice (tonnes)</text>
  <text x="159.1" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2</text>
  <text x="240.3" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">4</text>
  <text x="321.4" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">6</text>
  <text x="70.0" y="283.7" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">2</text>
  <text x="70.0" y="245.4" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">4</text>
  <text x="70.0" y="207.1" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">6</text>
  <text x="70.0" y="168.9" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">8</text>
  <text x="70.0" y="130.6" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">10</text>
  <text x="70.0" y="92.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">12</text>
  <line x1="78.0" y1="88.3" x2="321.4" y2="318.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="241.4" x2="159.1" y2="318.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="256.5" y="229.9" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">Thailand</text>
  <text x="142.9" y="266.3" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">Peru</text>
  <text x="220.0" y="97.9" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">Same slope (2 tonnes rice per bale)</text>
  <text x="220.0" y="117.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">for both countries</text>
</svg>

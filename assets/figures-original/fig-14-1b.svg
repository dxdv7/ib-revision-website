<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Microeconomic demand curve (for comparison)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Microeconomic demand curve (for comparison)</title><desc>A downward-sloping demand curve, D, with price on the vertical axis and quantity on the horizontal axis.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity (units)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price ($)</text>
  <line x1="104.0" y1="100.1" x2="322.0" y2="296.3" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="330.0" y="308.3" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Keynesian AS curve (three phases)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Keynesian AS curve (three phases)</title><desc>A Keynesian aggregate supply curve that is horizontal at low output (1), curves upward (2), then becomes vertical at full-employment output Yf (3).</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="315.0" y1="125.0" x2="315.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="315.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size='70%' dy='3'>f</tspan></text>
  <path d="M78.0,225.0 L232.0,225.0 L234.7,224.9 L237.4,224.8 L240.1,224.5 L242.8,224.1 L245.5,223.7 L248.2,223.1 L250.8,222.4 L253.5,221.6 L256.1,220.7 L258.7,219.7 L261.2,218.6 L263.8,217.4 L266.3,216.1 L268.7,214.7 L271.1,213.2 L273.5,211.6 L275.8,209.9 L278.1,208.1 L280.3,206.3 L282.5,204.3 L284.7,202.3 L286.7,200.2 L288.7,198.0 L290.7,195.7 L292.6,193.4 L294.4,190.9 L296.2,188.4 L297.8,185.9 L299.5,183.2 L301.0,180.6 L302.5,177.8 L303.9,175.0 L305.2,172.1 L306.4,169.2 L307.6,166.3 L308.7,163.3 L309.7,160.2 L310.6,157.1 L311.4,154.0 L312.2,150.9 L312.8,147.7 L313.4,144.5 L313.9,141.3 L314.3,138.1 L314.6,134.8 L314.8,131.5 L315.0,128.3 L315.0,125.0 L315.0,48.0" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="315.0" y="38.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">AS</text>
  <text x="90.0" y="245.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">(1) Perfectly elastic</text>
  <text x="262.0" y="160.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">(2) Upward</text>
  <text x="262.0" y="173.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">sloping</text>
  <text x="325.0" y="92.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">(3) Perfectly</text>
  <text x="325.0" y="105.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">inelastic</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Calculating consumer and producer surplus" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Calculating consumer and producer surplus</title><desc>Demand and supply for smartwatches crossing at $60 and 1,000 units, with consumer surplus (above $60) and producer surplus (below $60) shaded.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of smartwatches</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price ($)</text>
  <text x="70.0" y="277.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">20</text>
  <text x="70.0" y="232.7" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">40</text>
  <text x="70.0" y="188.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">60</text>
  <text x="70.0" y="143.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">80</text>
  <text x="70.0" y="98.7" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">100</text>
  <text x="70.0" y="54.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">120</text>
  <text x="149.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">500</text>
  <text x="220.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">1,000</text>
  <text x="291.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">1,500</text>
  <text x="362.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2,000</text>
  <path d="M78.0,50.0 L78.0,184.0 L220.0,184.0 Z" fill="#bfe3f4" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78.0,184.0 L78.0,273.3 L220.0,184.0 Z" fill="#d3ecc9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="78.0" y1="184.0" x2="220.0" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="220.0" y1="184.0" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="78.0" y1="50.0" x2="362.0" y2="318.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="273.3" x2="362.0" y2="94.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="220.0" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <text x="368.0" y="312.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="368.0" y="88.7" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="185.9" y="83.5" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Consumer</text>
  <text x="185.9" y="97.5" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">surplus</text>
  <line x1="183.1" y1="88.0" x2="148.8" y2="131.6" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="146.2,134.9 152.8,131.2 148.2,127.5" fill="#4a3f9f"/>
  <text x="86.5" y="204.1" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Producer</text>
  <text x="86.5" y="218.1" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">surplus</text>
</svg>

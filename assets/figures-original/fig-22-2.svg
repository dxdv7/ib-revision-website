<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" role="img" aria-label="Constructing a Lorenz curve (fictional country: Vantica)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Constructing a Lorenz curve (fictional country: Vantica)</title><desc>Lorenz curve for the fictional country Vantica built point by point from cumulative income shares of each quintile (4%, 13%, 28%, 52%, 100%), plotted against cumulative population shares, shown below the diagonal line of equality.</desc>
  <rect width="460" height="400" fill="#ffffff"/>
  <line x1="80.0" y1="340.0" x2="400.0" y2="340.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="80.0" y1="340.0" x2="80.0" y2="40.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="405.0,340.0 396.0,336.2 396.0,343.8" fill="#2b2b2b"/>
  <polygon points="80.0,35.0 76.2,44.0 83.8,44.0" fill="#2b2b2b"/>
  <text x="68.0" y="356.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="240.0" y="386.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Cumulative % of population</text>
  <text x="20.0" y="190.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 190.0)">Cumulative % of income</text>
  <text x="144.0" y="358.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">20</text>
  <text x="208.0" y="358.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">40</text>
  <text x="272.0" y="358.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">60</text>
  <text x="336.0" y="358.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">80</text>
  <text x="400.0" y="358.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">100</text>
  <text x="72.0" y="284.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">20</text>
  <text x="72.0" y="224.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">40</text>
  <text x="72.0" y="164.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">60</text>
  <text x="72.0" y="104.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">80</text>
  <text x="72.0" y="44.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">100</text>
  <line x1="80.0" y1="340.0" x2="400.0" y2="40.0" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M80.0,340.0 C90.7,338.0 122.7,334.5 144.0,328.0 C165.3,321.5 186.7,313.0 208.0,301.0 C229.3,289.0 250.7,275.5 272.0,256.0 C293.3,236.5 314.7,220.0 336.0,184.0 C357.3,148.0 389.3,64.0 400.0,40.0" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="144.0" cy="328.0" r="3.4" fill="#2b2b2b"/>
  <text x="154.0" y="320.0" font-size="10.2" text-anchor="start" fill="#2b2b2b" font-weight="400">1st quintile: 4%</text>
  <circle cx="208.0" cy="301.0" r="3.4" fill="#2b2b2b"/>
  <text x="218.0" y="293.0" font-size="10.2" text-anchor="start" fill="#2b2b2b" font-weight="400">1st+2nd: 13%</text>
  <circle cx="272.0" cy="256.0" r="3.4" fill="#2b2b2b"/>
  <text x="282.0" y="248.0" font-size="10.2" text-anchor="start" fill="#2b2b2b" font-weight="400">1st-3rd: 28%</text>
  <circle cx="336.0" cy="184.0" r="3.4" fill="#2b2b2b"/>
  <text x="346.0" y="176.0" font-size="10.2" text-anchor="start" fill="#2b2b2b" font-weight="400">1st-4th: 52%</text>
  <circle cx="400.0" cy="40.0" r="3.4" fill="#2b2b2b"/>
  <text x="410.0" y="28.0" font-size="10.2" text-anchor="start" fill="#2b2b2b" font-weight="400">All 5: 100%</text>
</svg>

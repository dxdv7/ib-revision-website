<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The money market" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The money market</title><desc>A downward-sloping demand for money DM with three vertical money supply curves SM1, SM and SM2 at quantities Q1, Qe and Q2. Equilibrium interest rates are i1, ie and i2, with purple arrows from SM to SM1 and SM2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of money</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Nominal interest rate</text>
  <line x1="78.0" y1="110.0" x2="165.0" y2="110.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="114.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="165.0" y1="110.0" x2="165.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="165.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="168.8" x2="232.0" y2="168.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="172.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="232.0" y1="168.8" x2="232.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="232.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="78.0" y1="227.5" x2="299.0" y2="227.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="231.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="299.0" y1="227.5" x2="299.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="299.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="108.0" y1="60.0" x2="352.0" y2="274.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="165.0" y1="318.0" x2="165.0" y2="54.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="165.0" y="46.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">M1</tspan></text>
  <line x1="232.0" y1="318.0" x2="232.0" y2="54.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="232.0" y="46.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">M</tspan></text>
  <line x1="299.0" y1="318.0" x2="299.0" y2="54.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="299.0" y="46.0" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">M2</tspan></text>
  <circle cx="165.0" cy="110.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="232.0" cy="168.8" r="3.6" fill="#2b2b2b"/>
  <circle cx="299.0" cy="227.5" r="3.6" fill="#2b2b2b"/>
  <line x1="227.0" y1="262.0" x2="174.8" y2="262.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="170.0,262.0 178.0,265.4 178.0,258.6" fill="#4a3f9f"/>
  <line x1="237.0" y1="262.0" x2="289.2" y2="262.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="294.0,262.0 286.0,258.6 286.0,265.4" fill="#4a3f9f"/>
  <text x="360.0" y="280.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">M</tspan></text>
</svg>

  <text x="70.0" y="258.2" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">w</tspan></text>
  <text x="70.0" y="219.9" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">w+T</tspan></text>
  <text x="359.4" y="84.3" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S (Domestic)</text>
  <text x="359.4" y="271.0" font-size="12" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="359.4" y="219.9" font-size="11" text-anchor="start" fill="#d9432f" font-weight="400">S (World)+tariff</text>
  <text x="359.4" y="258.2" font-size="11.5" text-anchor="start" fill="#d9432f" font-weight="400">S (World)</text>
  <text x="140.0" y="300.0" font-size="10.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Production</text>
  <text x="140.0" y="313.0" font-size="10.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">inefficiency</text>
  <text x="300.0" y="300.0" font-size="10.5" text-anchor="middle" fill="#4a3f9f" font-weight="400">Tariff</text>
  <text x="300.0" y="313.0" font-size="10.5" text-anchor="middle" fill="#4a3f9f" font-weight="400">revenue</text>
  <text x="255.0" y="60.0" font-size="10.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Consumer surplus</text>
  <text x="255.0" y="73.0" font-size="10.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">loss</text>

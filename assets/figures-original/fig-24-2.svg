<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 380" role="img" aria-label="Exporting when the world price is above the domestic price" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Exporting when the world price is above the domestic price</title><desc>Same S(Domestic)/D diagram as Figure 24.1 but with the horizontal S(World) line drawn above the autarky price Pe, so domestic demand falls to Q1, domestic supply rises to Q2, and the surplus Q1Q2 is exported.</desc>

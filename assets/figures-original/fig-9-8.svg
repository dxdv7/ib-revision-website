<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" role="img" aria-label="Effect of a carbon tax on steel" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Effect of a carbon tax on steel</title><desc>A $600 per tonne carbon tax shifts private marginal cost up from MPC to MPC plus carbon tax, cutting output from Q1 to Q2, but the tax is below the full external cost so output Q2 still exceeds Q* and a welfare loss triangle remains.</desc>
  <rect width="540" height="380" fill="#ffffff"/>
  <polygon points="210.0,154.2 259.5,176.6 259.5,131.9" fill="#f3b3aa" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="430.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="435.0,318.0 426.0,314.2 426.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="254.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of steel (million tonnes)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of steel ($ 00s per tonne)</text>
  <line x1="78.0" y1="198.9" x2="309.0" y2="198.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="202.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="309.0" y1="198.9" x2="309.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="309.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="176.6" x2="259.5" y2="176.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="180.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="259.5" y1="176.6" x2="259.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="259.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="78.0" y1="154.2" x2="210.0" y2="154.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="158.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P*</text>
  <line x1="210.0" y1="154.2" x2="210.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="210.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q*</text>
  <line x1="94.5" y1="206.3" x2="375.0" y2="79.8" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="94.5" y1="251.0" x2="391.5" y2="117.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5"/>
  <line x1="94.5" y1="295.7" x2="408.0" y2="154.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="94.5" y1="102.1" x2="408.0" y2="243.6" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="383.0" y="83.8" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC</text>
  <text x="399.5" y="121.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MPC + carbon tax</text>
  <text x="416.0" y="158.2" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MPC</text>
  <text x="416.0" y="247.6" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MSB = D</text>
  <circle cx="309.0" cy="198.9" r="3.6" fill="#2b2b2b"/>
  <circle cx="259.5" cy="176.6" r="3.6" fill="#2b2b2b"/>
  <circle cx="210.0" cy="154.2" r="3.6" fill="#2b2b2b"/>
  <line x1="355.2" y1="174.0" x2="355.2" y2="142.2" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="355.2,137.4 351.8,145.4 358.6,145.4" fill="#4a3f9f"/>
  <text x="364.2" y="159.7" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">$600</text>
  <line x1="305.0" y1="304.0" x2="268.3" y2="304.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="263.5,304.0 271.5,307.4 271.5,300.6" fill="#4a3f9f"/>
  <text x="137.4" y="64.9" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Remaining</text>
  <text x="137.4" y="78.9" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">welfare loss</text>
  <line x1="190.2" y1="84.9" x2="240.7" y2="147.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="243.0,149.8 241.2,143.5 237.3,146.7" fill="#2b2b2b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The demand for a Veblen good (luxury watches)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The demand for a Veblen good (luxury watches)</title><desc>A sideways-curving demand curve for luxury watches that slopes down at low prices, then bends back and slopes upward above a snob-value threshold price.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of luxury watches</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of luxury watches ($)</text>
  <line x1="78.0" y1="194.7" x2="378.0" y2="194.7" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <path d="M188.2,301.9 C186.0,299.2 179.0,291.2 175.0,285.8 C170.9,280.5 167.2,275.1 163.9,269.8 C160.5,264.4 157.5,259.0 154.9,253.7 C152.3,248.3 150.0,243.0 148.1,237.6 C146.2,232.2 144.7,226.9 143.5,221.5 C142.3,216.2 141.5,209.9 141.0,205.4 C140.5,201.0 140.5,197.4 140.5,194.7 C140.4,192.0 140.3,192.9 140.6,189.4 C140.9,185.8 141.4,178.6 142.4,173.3 C143.3,167.9 144.7,162.6 146.3,157.2 C148.0,151.8 150.0,146.5 152.4,141.1 C154.8,135.8 157.5,130.4 160.6,125.0 C163.7,119.7 167.2,114.3 171.0,109.0 C174.8,103.6 179.0,98.2 183.5,92.9 C188.1,87.5 193.9,81.3 198.2,76.8 C202.5,72.3 207.4,67.9 209.2,66.1" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="140.5" cy="194.7" r="3.6" fill="#2b2b2b"/>
  <text x="196.2" y="305.9" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <text x="217.2" y="70.1" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <text x="376.0" y="210.7" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">&#8216;Snob value&#8217; threshold</text>
  <text x="208.6" y="243.0" font-size="11.5" text-anchor="start" fill="#6b6b6b" font-weight="400">Normal range:</text>
  <text x="208.6" y="257.0" font-size="11.5" text-anchor="start" fill="#6b6b6b" font-weight="400">demand slopes down</text>
  <text x="248.4" y="88.2" font-size="11.5" text-anchor="start" fill="#6b6b6b" font-weight="400">Veblen range:</text>
  <text x="248.4" y="102.2" font-size="11.5" text-anchor="start" fill="#6b6b6b" font-weight="400">demand slopes up</text>
</svg>

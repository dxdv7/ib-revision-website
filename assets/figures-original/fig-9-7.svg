<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 380" role="img" aria-label="Negative externality of production: cement" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Negative externality of production: cement</title><desc>MSC lies above MPC by the external cost; the market quantity Q1 exceeds the efficient quantity Q*, leaving a welfare loss triangle.</desc>
  <rect width="470" height="380" fill="#ffffff"/>
  <polygon points="220.0,169.1 276.8,198.9 276.8,139.3" fill="#f3b3aa" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of cement (million tonnes)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of cement ($ per bag)</text>
  <line x1="78.0" y1="198.9" x2="276.8" y2="198.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="202.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="276.8" y1="198.9" x2="276.8" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="276.8" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="169.1" x2="220.0" y2="169.1" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="173.1" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P*</text>
  <line x1="220.0" y1="169.1" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q*</text>
  <line x1="92.2" y1="236.1" x2="333.6" y2="109.6" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="295.7" x2="362.0" y2="154.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="102.1" x2="362.0" y2="243.6" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="341.6" y="113.6" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC</text>
  <text x="370.0" y="158.2" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MPC = S</text>
  <text x="370.0" y="247.6" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MSB = D</text>
  <circle cx="276.8" cy="198.9" r="3.6" fill="#2b2b2b"/>
  <circle cx="220.0" cy="169.1" r="3.6" fill="#2b2b2b"/>
  <text x="220.0" y="159.1" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="400">a</text>
  <line x1="140.5" y1="210.8" x2="140.5" y2="270.4" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <polygon points="140.5,270.4 143.4,263.4 137.5,263.4" fill="#4a3f9f"/>
  <polygon points="140.5,210.8 137.5,217.8 143.4,217.8" fill="#4a3f9f"/>
  <text x="132.5" y="289.0" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">Negative</text>
  <text x="132.5" y="303.0" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">externality</text>
  <text x="237.0" y="79.8" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Welfare loss</text>
  <line x1="259.8" y1="84.8" x2="257.9" y2="161.0" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="257.8,164.6 260.4,158.7 255.4,158.6" fill="#2b2b2b"/>
</svg>

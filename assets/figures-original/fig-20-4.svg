<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="An inflationary spiral" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>An inflationary spiral</title><desc>AD/AS diagram with three numbered movements: (1) AD1 to AD2 along SRAS1 raises the price level from P1 to P2 and output from Y1 to Y2; (2) SRAS shifts left to SRAS2 as wages rise, price P3 and output back to Y1; (3) AD2 to AD3 along SRAS2 raises price to P4 and output to Y2 again.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="110.0" y1="116.8" x2="310.0" y2="306.8" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="152.0" y1="79.2" x2="352.0" y2="269.2" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="196.4" y1="44.0" x2="352.0" y2="191.8" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="112.0" y1="292.0" x2="338.0" y2="90.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="112.0" y1="214.6" x2="338.0" y2="12.6" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="315.0" y="312.8" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="357.0" y="275.2" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="357.0" y="197.8" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">3</tspan></text>
  <text x="342.0" y="86.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="342.0" y="8.6" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="78.0" y1="208.0" x2="206.0" y2="208.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="212.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="170.4" x2="248.0" y2="170.4" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="174.4" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="78.0" y1="130.5" x2="206.0" y2="130.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="134.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">3</tspan></text>
  <line x1="78.0" y1="93.0" x2="248.0" y2="93.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="97.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">4</tspan></text>
  <line x1="206.0" y1="130.5" x2="206.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="248.0" y1="93.0" x2="248.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="206.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="248.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="206.0" cy="208.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="248.0" cy="170.4" r="3.6" fill="#2b2b2b"/>
  <circle cx="206.0" cy="130.5" r="3.6" fill="#2b2b2b"/>
  <circle cx="248.0" cy="93.0" r="3.6" fill="#2b2b2b"/>
  <line x1="212.7" y1="202.0" x2="237.3" y2="180.0" stroke="#4a3f9f" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="241.3,176.4 232.1,179.6 237.1,185.3" fill="#4a3f9f"/>
  <line x1="241.5" y1="164.2" x2="216.4" y2="140.5" stroke="#4a3f9f" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="212.5,136.7 216.4,145.7 221.7,140.2" fill="#4a3f9f"/>
  <line x1="212.7" y1="124.5" x2="237.3" y2="102.6" stroke="#4a3f9f" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="241.3,99.0 232.1,102.2 237.1,107.8" fill="#4a3f9f"/>
  <text x="220.0" y="212.0" font-size="11.5" fill="#4a3f9f" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-weight="600">(1)</text>
  <text x="206.0" y="160.4" font-size="11.5" fill="#4a3f9f" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-weight="600">(2)</text>
  <text x="201.0" y="107.8" font-size="11.5" fill="#4a3f9f" stroke="#ffffff" stroke-width="3" paint-order="stroke" font-weight="600">(3)</text>
  <line x1="34.0" y1="202.0" x2="34.0" y2="103.2" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="34.0,99.0 31.1,106.0 36.9,106.0" fill="#4a3f9f"/>
</svg>

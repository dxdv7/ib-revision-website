<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img" aria-label="The elements of good governance" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The elements of good governance</title><desc>Hub-and-spoke diagram with 'Good governance' at the centre, connected by arrows to eight surrounding elements: participatory, consensus oriented, accountable, transparent, responsive, equitable and inclusive, effective and efficient, and follows the rule of law.</desc>
  <rect width="480" height="470" fill="#ffffff"/>
  <circle cx="240" cy="240" r="58" fill="#d9432f" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="240.0" y="236.0" font-size="14.5" text-anchor="middle" fill="#ffffff" font-weight="700">Good</text>
  <text x="240.0" y="256.0" font-size="14.5" text-anchor="middle" fill="#ffffff" font-weight="700">governance</text>
  <line x1="240.0" y1="178.0" x2="240.0" y2="124.8" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="240.0,120.0 236.6,128.0 243.4,128.0" fill="#d9432f"/>
  <text x="240.0" y="79.0" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Consensus</text>
  <text x="240.0" y="93.0" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">oriented</text>
  <line x1="283.8" y1="196.2" x2="321.5" y2="158.5" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="324.9,155.1 316.8,158.4 321.6,163.2" fill="#d9432f"/>
  <text x="351.7" y="132.3" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="600">Accountable</text>
  <line x1="302.0" y1="240.0" x2="355.2" y2="240.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="360.0,240.0 352.0,236.6 352.0,243.4" fill="#d9432f"/>
  <text x="398.0" y="244.0" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="600">Transparent</text>
  <line x1="283.8" y1="283.8" x2="321.5" y2="321.5" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="324.9,324.9 321.6,316.8 316.8,321.6" fill="#d9432f"/>
  <text x="351.7" y="355.7" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="600">Responsive</text>
  <line x1="240.0" y1="302.0" x2="240.0" y2="355.2" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="240.0,360.0 243.4,352.0 236.6,352.0" fill="#d9432f"/>
  <text x="240.0" y="395.0" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">Equitable and</text>
  <text x="240.0" y="409.0" font-size="12" text-anchor="middle" fill="#2b2b2b" font-weight="600">inclusive</text>
  <line x1="196.2" y1="283.8" x2="158.5" y2="321.5" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="155.1,324.9 163.2,321.6 158.4,316.8" fill="#d9432f"/>
  <text x="128.3" y="348.7" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="600">Effective and</text>
  <text x="128.3" y="362.7" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="600">efficient</text>
  <line x1="178.0" y1="240.0" x2="124.8" y2="240.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="120.0,240.0 128.0,243.4 128.0,236.6" fill="#d9432f"/>
  <text x="82.0" y="237.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="600">Follows the</text>
  <text x="82.0" y="251.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="600">rule of law</text>
  <line x1="196.2" y1="196.2" x2="158.5" y2="158.5" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="155.1,155.1 158.4,163.2 163.2,158.4" fill="#d9432f"/>
  <text x="128.3" y="132.3" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="600">Participatory</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The aggregate demand curve" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The aggregate demand curve</title><desc>A downward-sloping AD curve labelled AD = C + I + G + (X - M). At price level PL1 real output demanded is Y1; at the lower PL2 it is the higher Y2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output = national income = Y</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level ($)</text>
  <line x1="78.0" y1="120.0" x2="126.1" y2="120.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="124.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">PL<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="126.1" y1="120.0" x2="126.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="126.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="215.0" x2="231.7" y2="215.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="219.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">PL<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="231.7" y1="215.0" x2="231.7" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="231.7" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="104.0" y1="100.1" x2="322.0" y2="296.3" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="126.1" cy="120.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="231.7" cy="215.0" r="3.6" fill="#2b2b2b"/>
  <line x1="34.0" y1="126.0" x2="34.0" y2="204.8" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="34.0,209.0 36.9,202.0 31.1,202.0" fill="#4a3f9f"/>
  <line x1="138.1" y1="331.0" x2="215.5" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="219.7,331.0 212.7,328.1 212.7,333.9" fill="#4a3f9f"/>
  <text x="384.0" y="68.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">AD = C + I + G + (X&#8722;M)</text>
  <text x="330.0" y="308.3" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The total product curve" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The total product curve</title><desc>Total product curve rising at an increasing rate up to 5 workers, then at a decreasing rate, flattening towards 100 bicycles a week at 10 workers.</desc>

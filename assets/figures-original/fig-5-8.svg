  <text x="220.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">5</text>
  <text x="248.4" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">6</text>
  <text x="276.8" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">7</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Demand-pull inflation, first round" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Demand-pull inflation, first round</title><desc>AD/AS diagram showing one round of demand-pull inflation: AD shifts right from AD1 to AD2 along SRAS1, raising the price level from P1 to P2 and output from Y1 to Y2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="92.0" y1="68.0" x2="298.0" y2="268.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="148.0" y1="62.0" x2="354.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="146.0" y1="296.0" x2="338.0" y2="92.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="303.0" y="274.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="359.0" y="268.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="343.0" y="90.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="204.3" x2="232.3" y2="204.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="208.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="232.3" y1="204.3" x2="232.3" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="232.3" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="232.3" cy="204.3" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="172.7" x2="262.0" y2="172.7" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="176.7" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="262.0" y1="172.7" x2="262.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="262.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="262.0" cy="172.7" r="3.6" fill="#2b2b2b"/>
  <line x1="129.0" y1="100.0" x2="178.3" y2="100.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="183.1,100.0 175.1,96.6 175.1,103.4" fill="#4a3f9f"/>
  <line x1="264.9" y1="232.0" x2="314.3" y2="232.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="319.1,232.0 311.1,228.6 311.1,235.4" fill="#4a3f9f"/>
  <line x1="242.3" y1="345.0" x2="247.8" y2="345.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="252.0,345.0 245.0,342.1 245.0,347.9" fill="#4a3f9f"/>
  <line x1="40.0" y1="198.3" x2="40.0" y2="182.9" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="40.0,178.7 37.1,185.7 42.9,185.7" fill="#4a3f9f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" role="img" aria-label="Minimum wage and structural unemployment" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Minimum wage and structural unemployment</title><desc>Labour market for farm workers: equilibrium wage $8 at quantity Q. A minimum wage of $11 above equilibrium leaves Q1 workers demanded but Q2 supplied, so the gap from Q1 to Q2 is unemployment.</desc>
  <rect width="420" height="400" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="386.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of farm workers</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Farm-worker wage ($ per hour)</text>
  <line x1="103.8" y1="251.0" x2="336.2" y2="100.2" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="103.8" y1="117.0" x2="336.2" y2="267.8" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="340.2" y="94.2" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="340.2" y="271.8" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">D</text>
  <line x1="78.0" y1="133.8" x2="346.5" y2="133.8" stroke="#444444" stroke-width="2.4" stroke-linecap="round"/>
  <text x="350.5" y="129.8" font-size="11.5" text-anchor="start" fill="#444444" font-weight="400">Minimum</text>
  <text x="350.5" y="143.8" font-size="11.5" text-anchor="start" fill="#444444" font-weight="400">wage</text>
  <line x1="78.0" y1="184.0" x2="207.1" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="188.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">$8</text>
  <line x1="207.1" y1="184.0" x2="207.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="207.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <circle cx="207.1" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <line x1="129.6" y1="133.8" x2="129.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="284.5" y1="133.8" x2="284.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="129.6" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="284.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="70.0" y="137.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">$11</text>
  <circle cx="129.6" cy="133.8" r="3.6" fill="#2b2b2b"/>
  <circle cx="284.5" cy="133.8" r="3.6" fill="#2b2b2b"/>
  <line x1="135.6" y1="349.0" x2="278.5" y2="349.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="131.6,349.0 138.6,351.9 138.6,346.1" fill="#4a3f9f"/>
  <polygon points="282.5,349.0 275.5,346.1 275.5,351.9" fill="#4a3f9f"/>
  <text x="207.1" y="364.0" font-size="11.5" text-anchor="middle" fill="#4a3f9f" font-weight="400">Unemployment</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Increase in demand for headphones" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Increase in demand for headphones</title><desc>Demand shifts right from D1 to D2 against an unchanged supply curve, raising price from P1 to P2 and quantity from Q1 to Q2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of headphones (000s per month)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of headphones ($)</text>
  <line x1="110.0" y1="88.0" x2="300.0" y2="292.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="304.0" y="306.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="170.0" y1="74.0" x2="360.0" y2="278.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="364.0" y="292.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="120.0" y1="268.0" x2="360.0" y2="78.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="362.0" y="76.0" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <line x1="78.0" y1="196.2" x2="210.7" y2="196.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="200.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="210.7" y1="196.2" x2="210.7" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="210.7" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="210.7" cy="196.2" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="162.9" x2="252.8" y2="162.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="166.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="252.8" y1="162.9" x2="252.8" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="252.8" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="252.8" cy="162.9" r="3.6" fill="#2b2b2b"/>
  <line x1="141.9" y1="118.0" x2="202.2" y2="118.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="207.0,118.0 199.0,114.6 199.0,121.4" fill="#4a3f9f"/>
  <line x1="261.2" y1="246.0" x2="321.4" y2="246.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>

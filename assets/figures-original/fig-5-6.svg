<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The supply of laptops" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The supply of laptops</title><desc>Two parallel supply curves for laptops, S1 to the left of S, with two leftward arrows and dashed lines showing quantity supplied falling from Q to Q1 at price P.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of laptops</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of laptops ($)</text>
  <line x1="78.0" y1="178.6" x2="265.2" y2="178.6" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="182.6" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P</text>
  <line x1="265.2" y1="178.6" x2="265.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="265.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <line x1="208.4" y1="178.6" x2="208.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="208.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="208.6" y1="296.6" x2="316.6" y2="71.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="151.8" y1="296.6" x2="259.8" y2="71.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="265.2" cy="178.6" r="3.4" fill="#d9432f"/>
  <circle cx="208.4" cy="178.6" r="3.4" fill="#d9432f"/>
  <text x="322.6" y="65.4" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="265.8" y="65.4" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="297.1" y1="103.6" x2="253.1" y2="103.6" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="248.3,103.6 256.3,107.0 256.3,100.2" fill="#4a3f9f"/>
  <line x1="225.2" y1="253.7" x2="181.2" y2="253.7" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="176.4,253.7 184.4,257.0 184.4,250.3" fill="#4a3f9f"/>
</svg>

  <text x="70.0" y="245.4" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">200</text>
  <text x="70.0" y="207.1" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">300</text>
  <text x="70.0" y="168.9" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">400</text>
  <text x="70.0" y="130.6" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">500</text>
  <text x="70.0" y="92.3" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">600</text>
  <text x="134.8" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">200</text>
  <text x="191.6" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">400</text>

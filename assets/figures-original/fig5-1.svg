<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Supply curve for e-scooters" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Supply curve for e-scooters</title><desc>Upward-sloping supply curve: as the price of e-scooters rises, quantity supplied rises.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>

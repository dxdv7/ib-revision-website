  <path d="M284.5,191.3 L284.5,220.5 L336.2,220.5 Z" fill="#f8d3cd" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M215.7,191.3 L284.5,191.3 L284.5,220.5 L215.7,220.5 Z" fill="#e2defa" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="78.0" y1="269.3" x2="353.4" y2="113.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="74.4" x2="353.4" y2="230.3" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>

  <text x="164.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="164.1" cy="220.5" r="3.6" fill="#2b2b2b"/>

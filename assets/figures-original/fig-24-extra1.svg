  <circle cx="284.5" cy="191.3" r="3.6" fill="#2b2b2b"/>
  <line x1="336.2" y1="220.5" x2="336.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="336.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">4</tspan></text>

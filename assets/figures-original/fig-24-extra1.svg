  <text x="359.4" y="195.3" font-size="11" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">W</tspan>+Tariff</text>
  <text x="359.4" y="224.5" font-size="11.5" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">W</tspan></text>

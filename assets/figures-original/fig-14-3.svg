<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Shifts in aggregate demand" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Shifts in aggregate demand</title><desc>Three parallel downward-sloping AD curves: AD3 on the left, AD1 in the middle and AD2 on the right, with purple arrows from AD1 to AD2 and from AD1 to AD3.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="92.0" y1="119.8" x2="250.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="250.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">3</tspan></text>
  <line x1="110.0" y1="82.0" x2="310.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="310.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="170.0" y1="82.0" x2="370.0" y2="262.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="370.0" y="279.0" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="189.6" y1="150.0" x2="236.8" y2="150.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="241.6,150.0 233.6,146.6 233.6,153.4" fill="#4a3f9f"/>
  <line x1="181.6" y1="150.0" x2="134.4" y2="150.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="129.6,150.0 137.6,153.4 137.6,146.6" fill="#4a3f9f"/>
</svg>

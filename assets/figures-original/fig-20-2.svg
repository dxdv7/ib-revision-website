<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Cost-push inflation" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Cost-push inflation</title><desc>AD/AS diagram: short-run aggregate supply shifts left from SRAS1 to SRAS2 against a fixed AD curve, raising the price level from P1 to P2 while output falls from Y1 to Y2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="104.0" y1="70.0" x2="352.0" y2="288.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="88.0" y1="298.0" x2="284.0" y2="118.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="156.0" y1="298.0" x2="352.0" y2="118.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="357.0" y="294.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">AD</text>
  <text x="357.0" y="116.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="287.0" y="110.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="78.0" y1="204.9" x2="257.4" y2="204.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="208.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="257.4" y1="204.9" x2="257.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="257.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="257.4" cy="204.9" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="174.3" x2="222.7" y2="174.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="178.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="222.7" y1="174.3" x2="222.7" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="222.7" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <circle cx="222.7" cy="174.3" r="3.6" fill="#2b2b2b"/>
  <line x1="204.3" y1="250.0" x2="149.1" y2="250.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="144.3,250.0 152.3,253.4 152.3,246.6" fill="#4a3f9f"/>
  <line x1="247.4" y1="345.0" x2="236.9" y2="345.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="232.7,345.0 239.7,347.9 239.7,342.1" fill="#4a3f9f"/>
  <line x1="40.0" y1="198.9" x2="40.0" y2="184.5" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="40.0,180.3 37.1,187.3 42.9,187.3" fill="#4a3f9f"/>
</svg>

  <title>Economic growth to remove a deflationary gap/output gap</title><desc>Panel (a): AD shifts right from AD1 to AD2 along the unchanged SRAS and LRAS, moving output from Y1 up to Yf. Panel (b): the PPC shows a movement from point a (inside the curve) to point b, close to but not exactly on the curve.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="An expansionary monetary policy" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>An expansionary monetary policy</title><desc>AD shifts right from AD1 to AD2 along an upward-sloping SRAS. The price level rises from P1 to P2 and real output from Y1 to Y2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="78.0" y1="221.2" x2="205.0" y2="221.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="225.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="205.0" y1="221.2" x2="205.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="205.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="186.3" x2="246.1" y2="186.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="190.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="246.1" y1="186.3" x2="246.1" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="246.1" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Y<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="96.0" y1="123.1" x2="268.0" y2="277.9" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="176.0" y1="123.1" x2="348.0" y2="277.9" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="120.6" y1="293.0" x2="340.6" y2="106.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="205.0" cy="221.2" r="3.6" fill="#2b2b2b"/>
  <circle cx="246.1" cy="186.3" r="3.6" fill="#2b2b2b"/>
  <line x1="116.5" y1="138.0" x2="183.7" y2="138.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="188.5,138.0 180.5,134.6 180.5,141.4" fill="#4a3f9f"/>
  <line x1="154.3" y1="172.0" x2="221.5" y2="172.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="226.3,172.0 218.3,168.6 218.3,175.4" fill="#4a3f9f"/>
  <line x1="34.0" y1="215.2" x2="34.0" y2="196.5" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="34.0,192.3 31.1,199.3 36.9,199.3" fill="#4a3f9f"/>
  <line x1="217.0" y1="331.0" x2="229.9" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="234.1,331.0 227.1,328.1 227.1,333.9" fill="#4a3f9f"/>
  <text x="346.6" y="110.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">SRAS</text>
  <text x="268.0" y="294.9" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="348.0" y="294.9" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">AD<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="384.0" y="44.0" font-size="11" text-anchor="end" fill="#6b6b6b" font-weight="400">Policy: lower interest rates</text>
</svg>

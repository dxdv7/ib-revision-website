<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 572" role="img" aria-label="Inflows and outflows from the pool of unemployment" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Inflows and outflows from the pool of unemployment</title><desc>Flow diagram: five inflows (redundancy, resignation, school leavers, returners to the labour force, migrants) arrow down into a box labelled pool of unemployment; seven outflows (finding a job, retiring, education, caring for family, emigrating, giving up the search, death) arrow out below it.</desc>
  <rect width="560" height="572" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="700">Inflows: people becoming unemployed</text>
  <circle cx="36" cy="50.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="54.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Workers who are made redundant or dismissed</text>
  <circle cx="36" cy="70.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="74.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Workers who resign from their jobs</text>
  <circle cx="36" cy="90.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="94.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">School and college leavers who have not yet found work</text>
  <circle cx="36" cy="110.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="114.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">People re-entering the labour force (e.g. after caring for family)</text>
  <circle cx="36" cy="130.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="134.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Migrants who arrive and have not yet found work</text>
  <text x="24.0" y="156.0" font-size="11.5" text-anchor="start" fill="#6b6b6b" font-weight="400" font-style="italic">Each of these raises the level of unemployment.</text>
  <line x1="200.0" y1="176.0" x2="200.0" y2="204.4" stroke="#d9432f" stroke-width="7" stroke-linecap="round"/>
  <polygon points="200.0,214.0 206.7,198.0 193.3,198.0" fill="#d9432f"/>
  <line x1="280.0" y1="176.0" x2="280.0" y2="204.4" stroke="#d9432f" stroke-width="7" stroke-linecap="round"/>
  <polygon points="280.0,214.0 286.7,198.0 273.3,198.0" fill="#d9432f"/>
  <line x1="360.0" y1="176.0" x2="360.0" y2="204.4" stroke="#d9432f" stroke-width="7" stroke-linecap="round"/>
  <polygon points="360.0,214.0 366.7,198.0 353.3,198.0" fill="#d9432f"/>
  <rect x="150" y="218" width="260" height="56" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.2"/>
  <text x="280.0" y="252.0" font-size="15" text-anchor="middle" fill="#2b2b2b" font-weight="600">&#8220;Pool&#8221; of unemployment</text>
  <line x1="200.0" y1="278.0" x2="200.0" y2="306.4" stroke="#d9432f" stroke-width="7" stroke-linecap="round"/>
  <polygon points="200.0,316.0 206.7,300.0 193.3,300.0" fill="#d9432f"/>
  <line x1="280.0" y1="278.0" x2="280.0" y2="306.4" stroke="#d9432f" stroke-width="7" stroke-linecap="round"/>
  <polygon points="280.0,316.0 286.7,300.0 273.3,300.0" fill="#d9432f"/>
  <line x1="360.0" y1="278.0" x2="360.0" y2="306.4" stroke="#d9432f" stroke-width="7" stroke-linecap="round"/>
  <polygon points="360.0,316.0 366.7,300.0 353.3,300.0" fill="#d9432f"/>
  <text x="24.0" y="342.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="700">Outflows: people no longer counted as unemployed</text>
  <circle cx="36" cy="362.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="366.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">People who find a job</text>
  <circle cx="36" cy="382.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="386.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">People who retire</text>
  <circle cx="36" cy="402.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="406.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">People who move into full-time education</text>
  <circle cx="36" cy="422.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="426.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">People who leave the labour force to care for family</text>
  <circle cx="36" cy="442.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="446.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">People who emigrate</text>
  <circle cx="36" cy="462.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="466.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Discouraged workers who give up looking for work</text>
  <circle cx="36" cy="482.0" r="3" fill="#d9432f"/>
  <text x="48.0" y="486.0" font-size="12.5" text-anchor="start" fill="#2b2b2b" font-weight="400">People who die</text>
  <text x="24.0" y="508.0" font-size="11.5" text-anchor="start" fill="#6b6b6b" font-weight="400" font-style="italic">Each of these lowers the level of unemployment.</text>
  <text x="24.0" y="532.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Only the first outflow is a true return to employment; the others leave the</text>
  <text x="24.0" y="548.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">labour force, so those people are no longer &#8220;without work, available and</text>
  <text x="24.0" y="564.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">actively seeking work&#8221;.</text>
</svg>

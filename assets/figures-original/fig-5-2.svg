<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The supply of sneakers" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The supply of sneakers</title><desc>Two parallel upward-sloping supply curves for sneakers, S1 to the left of S, with two leftward arrows and dashed lines showing quantity falling from Q to Q1 at price P.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of sneakers</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of sneakers ($)</text>
  <line x1="78.0" y1="197.4" x2="275.2" y2="197.4" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="201.4" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P</text>
  <line x1="275.2" y1="197.4" x2="275.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="275.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <line x1="204.2" y1="197.4" x2="204.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="204.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="234.2" y1="291.2" x2="327.9" y2="76.8" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="163.2" y1="291.2" x2="256.9" y2="76.8" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="275.2" cy="197.4" r="3.4" fill="#d9432f"/>
  <circle cx="204.2" cy="197.4" r="3.4" fill="#d9432f"/>
  <text x="333.9" y="70.8" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="262.9" y="70.8" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="309.9" y1="109.0" x2="251.7" y2="109.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="246.9,109.0 254.9,112.3 254.9,105.6" fill="#4a3f9f"/>
  <line x1="244.3" y1="259.0" x2="186.1" y2="259.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="181.3,259.0 189.3,262.4 189.3,255.7" fill="#4a3f9f"/>
</svg>

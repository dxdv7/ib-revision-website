<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Keynesian long-run equilibrium output below full employment" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Keynesian long-run equilibrium output below full employment</title><desc>A Keynesian AS curve, flat then curving up to a vertical LRAS section at Yf. AD cuts the flat section at output Y and price P, with Y less than Yf. The gap between Y and Yf is labelled deflationary gap.</desc>

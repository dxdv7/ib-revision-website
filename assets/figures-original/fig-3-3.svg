  <polygon points="568.8,96.0 576.8,99.4 576.8,92.6" fill="#4a3f9f"/>
  <line x1="666.4" y1="132.0" x2="609.2" y2="132.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="604.4,132.0 612.4,135.4 612.4,128.6" fill="#4a3f9f"/>
  <line x1="696.0" y1="331.0" x2="654.2" y2="331.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>

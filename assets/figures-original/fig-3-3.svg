  <text x="490.0" y="174.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">p</text>
  <line x1="708.0" y1="170.0" x2="708.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="708.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q</text>
  <line x1="498.0" y1="170.0" x2="638.0" y2="170.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="638.0" y1="170.0" x2="638.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="638.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="708.0" cy="170.0" r="3.4" fill="#d9432f"/>

  <line x1="262.5" y1="205.0" x2="262.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="262.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q<tspan font-size="70%" dy="3">1</tspan></text>
  <circle cx="185.6" cy="140.0" r="3.4" fill="#d9432f"/>
  <circle cx="262.5" cy="205.0" r="3.4" fill="#d9432f"/>

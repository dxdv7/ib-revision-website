<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="The demand for bus travel and rail travel" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The demand for bus travel and rail travel</title><desc>Two panels. Bus travel: a fall in price from p to p1 is a movement along demand curve D from q to q1. Rail travel: the demand curve shifts left from D to D1.</desc>
  <rect width="860" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="390.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="50.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="395.0,318.0 386.0,314.2 386.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,45.0 74.2,54.0 81.8,54.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="234.0" y="358.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of bus trips (000s)</text>
  <text x="20.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 184.0)">Price of bus trips ($)</text>
  <text x="234.0" y="34.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">Demand for bus travel</text>
  <line x1="110.0" y1="76.0" x2="370.0" y2="296.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="376.0" y="306.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <line x1="78.0" y1="140.0" x2="185.6" y2="140.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="144.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">p</text>
  <line x1="185.6" y1="140.0" x2="185.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="185.6" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">q</text>

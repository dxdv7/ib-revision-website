  <polygon points="250.5,331.0 243.5,328.1 243.5,333.9" fill="#4a3f9f"/>
  <line x1="498.0" y1="318.0" x2="810.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="498.0" y1="318.0" x2="498.0" y2="50.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="815.0,318.0 806.0,314.2 806.0,321.8" fill="#2b2b2b"/>

  <text x="654.0" y="34.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="600">Demand for rail travel</text>
  <line x1="615.0" y1="76.0" x2="805.0" y2="268.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="812.0" y="284.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <line x1="545.0" y1="76.0" x2="735.0" y2="268.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="740.0" y="284.0" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D<tspan font-size="70%" dy="3">1</tspan></text>

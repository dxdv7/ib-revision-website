<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Shifts in SRAS" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Shifts in SRAS</title><desc>Three parallel upward-sloping SRAS curves: SRAS3 above and to the left, SRAS1 in the middle and SRAS2 below and to the right, with purple arrows from SRAS1 to each of the others.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Real output (Y)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Average price level</text>
  <line x1="96.0" y1="265.6" x2="262.0" y2="124.5" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="262.0" y="115.5" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">3</tspan></text>
  <line x1="146.0" y1="265.6" x2="312.0" y2="124.5" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="312.0" y="115.5" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="196.0" y1="265.6" x2="362.0" y2="124.5" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="362.0" y="115.5" font-size="12.5" text-anchor="middle" fill="#d9432f" font-weight="400">SRAS<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="184.9" y1="236.0" x2="222.1" y2="236.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="226.9,236.0 218.9,232.6 218.9,239.4" fill="#4a3f9f"/>
  <line x1="176.9" y1="236.0" x2="139.7" y2="236.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="134.9,236.0 142.9,239.4 142.9,232.6" fill="#4a3f9f"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" role="img" aria-label="A customs union" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A customs union</title><desc>Countries A, B and C inside a boundary marked as the common external tariff, trading freely with each other; goods from outsider D face the same tariff at every entry point.</desc>
  <rect width="500" height="380" fill="#ffffff"/>
  <rect x="18" y="22" width="244" height="336" rx="30" fill="#e6f5f7" stroke="#d9432f" stroke-width="5"/>

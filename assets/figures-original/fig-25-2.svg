  <text x="350.0" y="105.0" font-size="11.5" text-anchor="middle" fill="#d9432f" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Common external</text>
  <text x="350.0" y="120.0" font-size="11.5" text-anchor="middle" fill="#d9432f" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tariff on D&#8217;s goods</text>
  <text x="350.0" y="274.0" font-size="11.5" text-anchor="middle" fill="#d9432f" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Same tariff at every</text>
  <text x="350.0" y="289.0" font-size="11.5" text-anchor="middle" fill="#d9432f" font-weight="600" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">point of entry</text>
</svg>

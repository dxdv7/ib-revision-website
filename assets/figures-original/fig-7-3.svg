<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The market for e-bikes" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The market for e-bikes</title><desc>Demand for e-bikes shifts right from D to D1 against supply S; at the old price Pe there is excess demand Q2 minus Qe, so price rises to the new equilibrium Pe1.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of e-bikes (thousands per year)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of e-bikes ($)</text>
  <line x1="78.0" y1="150.3" x2="237.5" y2="150.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="154.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">e1</tspan><tspan dy="-3"></tspan></text>
  <line x1="78.0" y1="198.8" x2="274.2" y2="198.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="202.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">e</tspan><tspan dy="-3"></tspan></text>
  <line x1="180.5" y1="198.8" x2="180.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="180.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e</tspan><tspan dy="-3"></tspan></text>
  <line x1="237.5" y1="150.3" x2="237.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="237.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e1</tspan><tspan dy="-3"></tspan></text>
  <line x1="274.2" y1="198.8" x2="274.2" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="274.2" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">2</tspan><tspan dy="-3"></tspan></text>
  <line x1="89.4" y1="78.4" x2="242.7" y2="281.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="183.1" y1="78.4" x2="336.4" y2="281.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="89.4" y1="276.2" x2="305.2" y2="92.9" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="180.5" cy="198.8" r="3.6" fill="#2b2b2b"/>
  <circle cx="237.5" cy="150.3" r="3.6" fill="#2b2b2b"/>
  <circle cx="274.2" cy="198.8" r="3.4" fill="#d9432f"/>
  <line x1="185.5" y1="198.8" x2="269.2" y2="198.8" stroke="#3fb1e3" stroke-width="4.5" stroke-linecap="round"/>
  <text x="284.2" y="189.8" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">Excess demand</text>
  <line x1="237.5" y1="193.8" x2="237.5" y2="162.1" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="237.5,157.3 234.2,165.3 240.9,165.3" fill="#4a3f9f"/>
  <text x="311.2" y="86.9" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="248.7" y="295.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="342.4" y="295.0" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
</svg>

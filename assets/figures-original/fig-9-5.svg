<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 380" role="img" aria-label="Negative externality of consumption: e-cigarettes" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Negative externality of consumption: e-cigarettes</title><desc>MSB lies below MPB by the external cost; the market quantity Q1 exceeds the efficient quantity Q*, leaving a welfare loss triangle.</desc>
  <rect width="470" height="380" fill="#ffffff"/>
  <polygon points="220.0,213.8 276.8,184.0 276.8,243.6" fill="#f3b3aa" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of e-cigarettes (million packs)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of e-cigarettes ($ per pack)</text>
  <line x1="78.0" y1="184.0" x2="276.8" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="188.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="276.8" y1="184.0" x2="276.8" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="276.8" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="213.8" x2="220.0" y2="213.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="217.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P*</text>
  <line x1="220.0" y1="213.8" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q*</text>
  <line x1="92.2" y1="87.2" x2="362.0" y2="228.7" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="146.8" x2="362.0" y2="288.2" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="92.2" y1="280.8" x2="362.0" y2="139.3" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="370.0" y="232.7" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MPB = D</text>
  <text x="370.0" y="292.2" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MSB</text>
  <text x="370.0" y="143.3" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC = S</text>
  <circle cx="276.8" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <circle cx="220.0" cy="213.8" r="3.6" fill="#2b2b2b"/>
  <line x1="134.8" y1="109.6" x2="134.8" y2="169.1" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="butt" stroke-dasharray="2 3"/>
  <polygon points="134.8,169.1 137.7,162.1 131.9,162.1" fill="#4a3f9f"/>
  <polygon points="134.8,109.6 131.9,116.6 137.7,116.6" fill="#4a3f9f"/>
  <text x="144.8" y="141.3" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">Negative</text>
  <text x="144.8" y="155.3" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400">externality</text>
  <text x="313.7" y="187.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Welfare loss</text>
  <line x1="310.7" y1="183.0" x2="271.3" y2="207.4" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="268.3,209.3 274.7,208.3 272.0,204.0" fill="#2b2b2b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" role="img" aria-label="Specific tax with inelastic demand and elastic supply" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Specific tax with inelastic demand and elastic supply</title><desc>Steep demand and flat supply: a $10 tax raises the price from $10 to $18, so consumers bear most of it.</desc>
  <rect width="420" height="430" fill="#ffffff"/>
  <g transform="translate(0,0)">
  <polygon points="78.0,176.1 191.6,176.1 191.6,239.2 78.0,239.2" fill="#f6d9a0" stroke="none"/>
  <polygon points="78.0,239.2 191.6,239.2 191.6,254.9 78.0,254.9" fill="#b4e3e9" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of petrol (million drums)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of petrol ($ per drum)</text>
  <line x1="78.0" y1="239.2" x2="248.4" y2="239.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="243.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="248.4" y1="239.2" x2="248.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="248.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">e</tspan></text>
  <line x1="78.0" y1="176.1" x2="191.6" y2="176.1" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="180.1" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="191.6" y1="176.1" x2="191.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="191.6" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="254.9" x2="191.6" y2="254.9" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="258.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">C</text>
  <line x1="92.2" y1="65.8" x2="305.2" y2="302.2" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="286.5" x2="362.0" y2="207.6" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="207.6" x2="362.0" y2="128.8" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="313.2" y="306.2" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="400">D</text>
  <text x="370.0" y="211.6" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="370.0" y="132.8" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S + tax</text>
  <circle cx="248.4" cy="239.2" r="3.6" fill="#2b2b2b"/>
  <circle cx="191.6" cy="176.1" r="3.6" fill="#2b2b2b"/>
  <circle cx="191.6" cy="254.9" r="3.6" fill="#2b2b2b"/>
  <text x="255.4" y="230.2" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">W</text>
  <text x="198.6" y="167.1" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">X</text>
  <text x="198.6" y="268.9" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Y</text>
  <line x1="310.9" y1="217.8" x2="310.9" y2="151.8" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="310.9,147.0 307.5,155.0 314.2,155.0" fill="#4a3f9f"/>
  <text x="318.9" y="186.4" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="400" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">$10</text>
  </g>
  <rect x="96" y="386" width="16" height="11" fill="#f6d9a0" stroke="#9a9a9a" stroke-width="0.7"/>
  <text x="121.0" y="396.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Tax burden on consumers</text>
  <rect x="96" y="405" width="16" height="11" fill="#b4e3e9" stroke="#9a9a9a" stroke-width="0.7"/>
  <text x="121.0" y="415.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Tax burden on producers</text>
</svg>

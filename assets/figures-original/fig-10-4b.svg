<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Figure 10.4(b): TR when PED = infinity" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Figure 10.4(b): TR when PED = infinity</title><desc>Total revenue is an upward-sloping straight line through the origin, reaching $40 at 5 units, with slope equal to the constant price of $8.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity (units)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Total revenue ($)</text>
  <text x="70.0" y="255.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">20</text>
  <text x="70.0" y="188.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">40</text>
  <text x="70.0" y="121.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">60</text>
  <text x="70.0" y="54.0" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">80</text>
  <text x="134.8" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">2</text>
  <text x="191.6" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">4</text>
  <text x="248.4" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">6</text>
  <text x="305.2" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">8</text>
  <text x="362.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">10</text>
  <path d="M78.00,318.00 L362.00,50.00" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370.0" y="56.0" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">TR</text>
  <line x1="78.0" y1="184.0" x2="220.0" y2="184.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="220.0" y1="184.0" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">5</text>
  <circle cx="220.0" cy="184.0" r="3.6" fill="#2b2b2b"/>
  <text x="92.2" y="63.4" font-size="11" text-anchor="start" fill="#4a3f9f" font-weight="400" font-style="italic">Each extra unit adds $8 to TR,</text>
  <text x="92.2" y="86.8" font-size="11" text-anchor="start" fill="#4a3f9f" font-weight="400" font-style="italic">so MR is constant at $8.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="The demand for streaming subscriptions (elastic, revenue falls)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The demand for streaming subscriptions (elastic, revenue falls)</title><desc>A downward-sloping demand curve for streaming subscriptions with shaded revenue areas a, b and c. Price rises from $10 to $12 and subscribers fall from 50,000 to 35,000.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <rect x="78.0" y="117.0" width="165.7" height="33.5" fill="#e2f3e4"/>
  <rect x="243.7" y="150.5" width="71.0" height="167.5" fill="#fbe3df"/>
  <rect x="78.0" y="150.5" width="165.7" height="167.5" fill="#efefef"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of subscriptions (000s)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Monthly price of subscription ($)</text>
  <line x1="78.0" y1="150.5" x2="314.7" y2="150.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="154.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">10</text>
  <line x1="314.7" y1="150.5" x2="314.7" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="314.7" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">50</text>
  <line x1="78.0" y1="117.0" x2="243.7" y2="117.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="121.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">12</text>
  <line x1="243.7" y1="117.0" x2="243.7" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="243.7" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">35</text>
  <line x1="172.7" y1="83.5" x2="352.5" y2="168.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="314.7" cy="150.5" r="3.4" fill="#d9432f"/>
  <circle cx="243.7" cy="117.0" r="3.4" fill="#d9432f"/>
  <text x="358.5" y="172.4" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">D</text>
  <text x="160.8" y="138.8" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="400">a</text>
  <text x="160.8" y="234.2" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="400">b</text>
  <text x="279.2" y="234.2" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="400">c</text>
  <line x1="42.0" y1="146.5" x2="42.0" y2="125.2" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="42.0,121.0 39.1,128.0 44.9,128.0" fill="#4a3f9f"/>
  <line x1="309.7" y1="349.0" x2="252.9" y2="349.0" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="248.7,349.0 255.7,351.9 255.7,346.1" fill="#4a3f9f"/>
</svg>

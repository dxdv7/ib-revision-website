<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="The balancing balance of payments" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The balancing balance of payments</title><desc>Balance-scale diagram showing the current account balanced on one side against the sum of the capital account, financial account and net errors and omissions on the other.</desc>
  <rect width="480" height="320" fill="#ffffff"/>
  <line x1="90.0" y1="230.0" x2="420.0" y2="230.0" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="255,230 230,276 280,276" fill="none" stroke="#d9432f" stroke-width="2.6"/>
  <text x="170.0" y="170.0" font-size="14" text-anchor="middle" fill="#2b2b2b" font-weight="600">Current account</text>
  <text x="255.0" y="170.0" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="700">=</text>
  <text x="345.0" y="130.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="500">Capital account</text>
  <text x="345.0" y="150.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="500">+</text>
  <text x="345.0" y="170.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="500">Financial account</text>
  <text x="345.0" y="190.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="500">+</text>
  <text x="345.0" y="210.0" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="500">Net errors and omissions</text>
</svg>

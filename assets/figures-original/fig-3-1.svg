<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="A demand curve for smartwatches" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A demand curve for smartwatches</title><desc>A downward-sloping demand curve for smartwatches: at $180 quantity demanded is 200 units per week and at $120 it is 400 units.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of smartwatches (units per week)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of smartwatches ($)</text>
  <text x="70.0" y="268.4" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">60</text>
  <text x="70.0" y="214.8" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">120</text>
  <text x="70.0" y="161.2" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">180</text>
  <text x="70.0" y="107.6" font-size="11" text-anchor="end" fill="#2b2b2b" font-weight="400">240</text>
  <text x="134.8" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">200</text>
  <text x="191.6" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">400</text>
  <text x="248.4" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">600</text>
  <text x="305.2" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">800</text>
  <text x="362.0" y="336.0" font-size="11" text-anchor="middle" fill="#2b2b2b" font-weight="400">1,000</text>
  <line x1="78.0" y1="157.2" x2="134.8" y2="157.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="134.8" y1="157.2" x2="134.8" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="78.0" y1="210.8" x2="191.6" y2="210.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <line x1="191.6" y1="210.8" x2="191.6" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <path d="M106.4,90.2 C108.8,96.9 115.9,119.2 120.6,130.4 C125.3,141.6 127.7,147.2 134.8,157.2 C141.9,167.2 153.7,181.8 163.2,190.7 C172.7,199.6 182.1,205.2 191.6,210.8 C201.1,216.4 208.2,219.7 220.0,224.2 C231.8,228.7 248.4,233.9 262.6,237.6 C276.8,241.3 291.0,244.0 305.2,246.5 C319.4,249.1 340.7,251.9 347.8,252.9" fill="none" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="134.8" cy="157.2" r="3.4" fill="#d9432f"/>
  <circle cx="191.6" cy="210.8" r="3.4" fill="#d9432f"/>
  <text x="347.8" y="236.9" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">D (Demand)</text>
</svg>

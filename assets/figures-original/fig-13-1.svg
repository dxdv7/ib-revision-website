<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-label="The circular flow of income (referenced diagram)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The circular flow of income (referenced diagram)</title><desc>Two-sector circular flow of income. Households and firms are joined by four numbered flows; flows 2, 3 and 4 are marked as the income, output and expenditure methods of measuring national income.</desc>
  <rect width="520" height="390" fill="#ffffff"/>
  <rect x="190" y="34" width="140" height="50" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.2"/>
  <text x="260.0" y="64.0" font-size="14" text-anchor="middle" fill="#2b2b2b" font-weight="600">Households</text>
  <rect x="190" y="296" width="140" height="50" rx="8" fill="#fdeaea" stroke="#d9432f" stroke-width="2.2"/>
  <text x="260.0" y="326.0" font-size="14" text-anchor="middle" fill="#2b2b2b" font-weight="600">Firms</text>
  <line x1="232.0" y1="298.0" x2="232.0" y2="92.8" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="232.0,88.0 228.6,96.0 235.4,96.0" fill="#4a3f9f"/>
  <text x="224.0" y="178.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">Goods and</text>
  <text x="224.0" y="194.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">services (3)</text>
  <text x="224.0" y="212.0" font-size="10.5" text-anchor="end" fill="#6b6b6b" font-weight="400" font-style="italic">output method</text>
  <line x1="288.0" y1="86.0" x2="288.0" y2="289.2" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="288.0,294.0 291.4,286.0 284.6,286.0" fill="#4a3f9f"/>
  <text x="296.0" y="178.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Factors of</text>
  <text x="296.0" y="194.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">production (1)</text>
  <line x1="188.0" y1="59.0" x2="56.0" y2="59.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="56.0" y1="59.0" x2="56.0" y2="321.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="56.0" y1="321.0" x2="183.2" y2="321.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="188.0,321.0 180.0,317.6 180.0,324.4" fill="#d9432f"/>
  <text x="44.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 44 190)">Expenditure on goods and services (4)</text>
  <text x="28.0" y="190.0" font-size="10.5" text-anchor="middle" fill="#6b6b6b" font-weight="400" font-style="italic" transform="rotate(-90 28 190)">expenditure method</text>
  <line x1="332.0" y1="321.0" x2="464.0" y2="321.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="464.0" y1="321.0" x2="464.0" y2="59.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="butt"/>
  <line x1="464.0" y1="59.0" x2="336.8" y2="59.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="332.0,59.0 340.0,62.4 340.0,55.6" fill="#d9432f"/>
  <text x="478.0" y="190.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(90 478 190)">Wages, rent, interest and profits (2)</text>
  <text x="494.0" y="190.0" font-size="10.5" text-anchor="middle" fill="#6b6b6b" font-weight="400" font-style="italic" transform="rotate(90 494 190)">income method</text>
  <line x1="150.0" y1="372.0" x2="178.0" y2="372.0" stroke="#d9432f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="184.0" y="376.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">Money flows</text>
  <line x1="290.0" y1="372.0" x2="318.0" y2="372.0" stroke="#4a3f9f" stroke-width="2.4" stroke-linecap="round"/>
  <text x="324.0" y="376.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400">Real flows</text>
</svg>

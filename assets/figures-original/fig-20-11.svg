<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Supply-side policies can reduce the natural rate of unemployment" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Supply-side policies can reduce the natural rate of unemployment</title><desc>Two vertical long-run Phillips curves: LRPC1 at the natural rate of unemployment NRU1 and LRPC2 to its left at a lower rate NRU2, with two arrows showing the leftward shift.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="42.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="78.0,37.0 74.2,46.0 81.8,46.0" fill="#2b2b2b"/>
  <line x1="78.0" y1="286.9" x2="384.0" y2="286.9" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,286.9 380.0,283.1 380.0,290.7" fill="#2b2b2b"/>
  <text x="70.0" y="290.9" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Unemployment rate (%)</text>
  <text x="20.0" y="181.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 181.0)">Inflation rate (%)</text>
  <line x1="252.8" y1="286.9" x2="252.8" y2="63.4" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="187.2" y1="286.9" x2="187.2" y2="63.4" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="252.8" y="55.4" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">LRPC<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="187.2" y="55.4" font-size="12.5" text-anchor="middle" fill="#6b6b6b" font-weight="400">LRPC<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="252.8" y1="286.9" x2="252.8" y2="291.9" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
  <text x="252.8" y="303.9" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">NRU<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="187.2" y1="286.9" x2="187.2" y2="291.9" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
  <text x="187.2" y="303.9" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">NRU<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="248.8" y1="209.2" x2="196.0" y2="209.2" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="191.2,209.2 199.2,212.5 199.2,205.8" fill="#4a3f9f"/>
  <line x1="248.8" y1="121.7" x2="196.0" y2="121.7" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="191.2,121.7 199.2,125.1 199.2,118.4" fill="#4a3f9f"/>
</svg>

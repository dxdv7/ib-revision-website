<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Crowding out, moderate view" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Crowding out, moderate view</title><desc>Loanable funds market with an upward-sloping supply S. Government borrowing shifts demand right from D1 to D2, raising the interest rate from i1 to i2 and total borrowing from QLF1 to QLF3, while private borrowing falls to QLF2.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of loanable funds</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Interest rate</text>
  <line x1="96.0" y1="62.0" x2="296.0" y2="282.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="188.0" y1="62.0" x2="388.0" y2="282.0" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="104.0" y1="292.0" x2="346.0" y2="58.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <text x="300.0" y="296.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">1</tspan></text>
  <text x="392.0" y="286.0" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">D<tspan font-size="70%" dy="3">2</tspan></text>
  <text x="350.0" y="56.0" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">S (loanable</text>
  <text x="350.0" y="70.0" font-size="12" text-anchor="start" fill="#d9432f" font-weight="400">funds)</text>
  <line x1="78.0" y1="188.5" x2="211.0" y2="188.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="192.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="211.0" y1="188.5" x2="211.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="211.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">LF1</tspan></text>
  <circle cx="211.0" cy="188.5" r="3.6" fill="#2b2b2b"/>
  <line x1="78.0" y1="141.2" x2="260.0" y2="141.2" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="145.2" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">i<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="260.0" y1="141.2" x2="260.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="260.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">LF3</tspan></text>
  <circle cx="260.0" cy="141.2" r="3.6" fill="#2b2b2b"/>
  <line x1="168.0" y1="141.2" x2="168.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="168.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">LF2</tspan></text>

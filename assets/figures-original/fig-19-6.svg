  <line x1="258.2" y1="236.0" x2="337.4" y2="236.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="342.2,236.0 334.2,232.6 334.2,239.4" fill="#4a3f9f"/>
  <line x1="38.0" y1="182.5" x2="38.0" y2="151.4" stroke="#4a3f9f" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="38.0,147.2 35.1,154.2 40.9,154.2" fill="#4a3f9f"/>
</svg>

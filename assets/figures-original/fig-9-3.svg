<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" role="img" aria-label="Measures to promote vaccination" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Measures to promote vaccination</title><desc>A subsidy shifts MSC down, or an awareness campaign shifts MPB right, so that output reaches the efficient quantity Q*.</desc>
  <rect width="540" height="460" fill="#ffffff"/>
  <g transform="translate(0,0)">
  <polygon points="216.5,163.9 216.5,217.5 266.9,190.7" fill="#b5e2c0" stroke="none"/>
  <line x1="78.0" y1="318.0" x2="440.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="445.0,318.0 436.0,314.2 436.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="259.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity of vaccines (000 doses)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of vaccines ($ per dose)</text>
  <line x1="78.0" y1="217.5" x2="216.5" y2="217.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="221.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="216.5" y1="217.5" x2="216.5" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="216.5" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q<tspan font-size="70%" dy="3">1</tspan></text>
  <line x1="78.0" y1="190.7" x2="266.9" y2="190.7" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="194.7" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P*</text>
  <line x1="266.9" y1="190.7" x2="266.9" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="266.9" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q*</text>
  <line x1="78.0" y1="244.3" x2="266.9" y2="244.3" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="248.3" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan></text>
  <line x1="90.6" y1="150.5" x2="342.4" y2="284.5" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="90.6" y1="96.9" x2="405.4" y2="264.4" stroke="#6b6b6b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="90.6" y1="284.5" x2="367.6" y2="137.1" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="141.0" y1="311.3" x2="367.6" y2="190.7" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 5"/>
  <text x="350.4" y="288.5" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MPB</text>
  <text x="413.4" y="268.4" font-size="12.5" text-anchor="start" fill="#6b6b6b" font-weight="400">MSB</text>
  <text x="375.6" y="141.1" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC</text>
  <text x="375.6" y="194.7" font-size="12.5" text-anchor="start" fill="#d9432f" font-weight="400">MSC + subsidy</text>
  <circle cx="216.5" cy="217.5" r="3.6" fill="#2b2b2b"/>
  <circle cx="266.9" cy="190.7" r="3.6" fill="#2b2b2b"/>
  <circle cx="266.9" cy="244.3" r="3.6" fill="#2b2b2b"/>
  <line x1="319.8" y1="166.6" x2="319.8" y2="207.4" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="319.8,212.2 323.1,204.2 316.4,204.2" fill="#4a3f9f"/>
  <text x="328.8" y="193.4" font-size="13" text-anchor="start" fill="#4a3f9f" font-weight="700">1</text>
  <line x1="308.7" y1="264.4" x2="396.6" y2="264.4" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="401.4,264.4 393.4,261.0 393.4,267.8" fill="#4a3f9f"/>
  <text x="355.0" y="255.4" font-size="13" text-anchor="middle" fill="#4a3f9f" font-weight="700">2</text>
  </g>
  <text x="94.0" y="396.0" font-size="12.5" text-anchor="start" fill="#4a3f9f" font-weight="700">1</text>
  <text x="115.0" y="396.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Solution 1: a subsidy shifts MSC down to MSC + subsidy (price falls to P2)</text>
  <text x="94.0" y="415.0" font-size="12.5" text-anchor="start" fill="#4a3f9f" font-weight="700">2</text>
  <text x="115.0" y="415.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Solution 2: an awareness campaign shifts MPB right towards MSB</text>
  <rect x="90" y="424" width="16" height="11" fill="#b5e2c0" stroke="#9a9a9a" stroke-width="0.7"/>
  <text x="115.0" y="434.0" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="400">Potential welfare gain from raising output from Q1 to Q*</text>
</svg>

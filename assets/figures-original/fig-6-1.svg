<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="A perfectly inelastic supply curve (PES = 0)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>A perfectly inelastic supply curve (PES = 0)</title><desc>A vertical supply curve at quantity Q: quantity supplied is the same at prices P1 and P2, so PES = 0.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Quantity supplied of product</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Price of product ($)</text>
  <line x1="78.0" y1="243.0" x2="220.0" y2="243.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="247.0" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">1</tspan><tspan dy="-3"></tspan></text>
  <line x1="78.0" y1="151.8" x2="220.0" y2="151.8" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="155.8" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">P<tspan font-size="70%" dy="3">2</tspan><tspan dy="-3"></tspan></text>
  <line x1="220.0" y1="243.0" x2="220.0" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="220.0" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Q</text>
  <line x1="220.0" y1="318.0" x2="220.0" y2="63.4" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="220.0" cy="243.0" r="3.4" fill="#d9432f"/>
  <circle cx="220.0" cy="151.8" r="3.4" fill="#d9432f"/>
  <text x="228.0" y="71.4" font-size="13" text-anchor="start" fill="#d9432f" font-weight="400">S</text>
  <text x="234.0" y="200.1" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="600">PES = 0</text>
  <text x="234.0" y="215.1" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="400" font-style="italic">Q stays fixed at any price</text>
</svg>

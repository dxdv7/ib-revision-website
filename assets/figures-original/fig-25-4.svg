<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 380" role="img" aria-label="Trade diversion (worked example: footwear, Chile, Vietnam and Brazil)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Trade diversion (worked example: footwear, Chile, Vietnam and Brazil)</title><desc>Supply and demand for footwear in an importing country with three partner supply lines: outside supplier with and without tariff and a higher-cost union partner; shaded areas show loss of world efficiency, extra cost and loss of consumer surplus.</desc>

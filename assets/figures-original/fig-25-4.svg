  <circle cx="227.5" cy="210.8" r="3.6" fill="#2b2b2b"/>
  <line x1="272.3" y1="251.0" x2="272.3" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>

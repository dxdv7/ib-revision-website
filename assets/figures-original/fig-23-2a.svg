<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Peru &amp;ndash; potential gains from specialization and trade" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Peru &amp;ndash; potential gains from specialization and trade</title><desc>Peru's PPC (rice vertical, textiles horizontal) with point x at 280 textiles, 180 rice before specialization, and point y outside the curve at 400 textiles, 200 rice after specialization and trade, with exports and imports marked.</desc>
  <rect width="420" height="380" fill="#ffffff"/>
  <line x1="78.0" y1="318.0" x2="384.0" y2="318.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="78.0" y1="318.0" x2="78.0" y2="30.0" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="389.0,318.0 380.0,314.2 380.0,321.8" fill="#2b2b2b"/>
  <polygon points="78.0,25.0 74.2,34.0 81.8,34.0" fill="#2b2b2b"/>
  <text x="66.0" y="334.0" font-size="12" text-anchor="end" fill="#2b2b2b" font-weight="400">0</text>
  <text x="231.0" y="366.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">Textiles (000 bales)</text>
  <text x="20.0" y="174.0" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="400" transform="rotate(-90 20 174.0)">Rice (000 tonnes)</text>
  <line x1="78.0" y1="78.7" x2="331.6" y2="318.0" stroke="#d9432f" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="78.0" y1="174.4" x2="179.4" y2="174.4" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="178.4" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">180</text>
  <line x1="179.4" y1="174.4" x2="179.4" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="179.4" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">280</text>
  <circle cx="179.4" cy="174.4" r="3.6" fill="#2b2b2b"/>
  <text x="187.4" y="168.4" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">x</text>
  <circle cx="331.6" cy="318.0" r="3.4" fill="#6b6b6b"/>
  <line x1="331.6" y1="318.0" x2="222.9" y2="318.0" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 4"/>
  <line x1="222.9" y1="318.0" x2="222.9" y2="163.3" stroke="#4a3f9f" stroke-width="2.0" stroke-linecap="round"/>
  <polygon points="222.9,158.5 219.5,166.5 226.3,166.5" fill="#4a3f9f"/>
  <circle cx="222.9" cy="158.5" r="3.6" fill="#2b2b2b"/>
  <text x="230.9" y="152.5" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="400">y</text>
  <line x1="78.0" y1="158.5" x2="222.9" y2="158.5" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="70.0" y="162.5" font-size="11.5" text-anchor="end" fill="#2b2b2b" font-weight="400">200</text>
  <line x1="222.9" y1="158.5" x2="222.9" y2="318.0" stroke="#27b5c2" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 4"/>
  <text x="222.9" y="336.0" font-size="11.5" text-anchor="middle" fill="#2b2b2b" font-weight="400">400</text>
  <text x="86.0" y="70.7" font-size="11.5" text-anchor="start" fill="#d9432f" font-weight="400">Peru's PPC</text>
  <text x="378.0" y="46.0" font-size="10.5" text-anchor="end" fill="#4a3f9f" font-weight="400">Exports: 300,000 textiles</text>
  <text x="378.0" y="60.0" font-size="10.5" text-anchor="end" fill="#4a3f9f" font-weight="400">Imports: 200,000 rice</text>
</svg>
